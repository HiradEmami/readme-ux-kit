<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="terminal_recovery_stepsTitle terminal_recovery_stepsDesc">
  <title id="terminal_recovery_stepsTitle">Recovery Steps</title>
  <desc id="terminal_recovery_stepsDesc">A README errors section explaining recovery steps. The exact generic command is tool recover --dry-run. Its copyable Markdown equivalent is in docs/TERMINAL_PANEL_COMMANDS.md. Static composition.</desc>
