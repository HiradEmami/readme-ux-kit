<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="terminal_trace_spanTitle terminal_trace_spanDesc">
  <title id="terminal_trace_spanTitle">Trace Span</title>
  <desc id="terminal_trace_spanDesc">A README logs section explaining trace span. The exact generic command is tool trace TRACE_ID. Its copyable Markdown equivalent is in docs/TERMINAL_PANEL_COMMANDS.md. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
  <g id="terminal_trace_spanBase" data-edit-id="base" data-edit-label="Terminal window" data-edit-lock="true"><rect width="900" height="420" rx="18" fill="#08111f"/><rect x="24" y="24" width="852" height="372" rx="14" fill="#0b1525" stroke="#22d3ee" stroke-width="2"/><path d="M24 76H876" stroke="#22d3ee" opacity=".5"/><circle cx="52" cy="50" r="7" fill="#fb7185"/><circle cx="76" cy="50" r="7" fill="#fbbf24"/><circle cx="100" cy="50" r="7" fill="#34d399"/></g>
  <g id="terminal_trace_spanHeader" data-edit-id="header" data-edit-label="Panel heading"><text id="terminal_trace_spanLabel" data-edit-id="label" data-edit-label="Panel title" x="128" y="58" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Trace Span</text><text x="820" y="56" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">SAMPLE SESSION</text></g>
  <g id="terminal_trace_spanCommand" data-edit-id="command" data-edit-label="Editable command"><text x="54" y="130" font-family="'Courier New',Consolas,monospace" font-size="24" font-weight="700" fill="#22d3ee">$</text><text id="terminal_trace_spanCommandText" data-edit-id="command-text" data-edit-label="Copyable command" x="82" y="130" font-family="'Courier New',Consolas,monospace" font-size="21" fill="#f8fafc">tool trace TRACE_ID</text><rect x="82" y="145" width="14" height="3" fill="#22d3ee"><animate id="terminal_trace_spanCursorMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="terminal_trace_spanOutput" data-edit-id="output" data-edit-label="Illustrative output"><rect x="52" y="178" width="380" height="190" rx="12" fill="#111c2e" stroke="#22d3ee"/><rect x="468" y="178" width="380" height="190" rx="12" fill="#111c2e" stroke="#22d3ee"/><text x="96" y="220" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] command accepted</text><text x="96" y="258" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] placeholder output</text><text x="96" y="296" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] review before use</text><text x="96" y="334" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] no live status implied</text></g>
</svg>
