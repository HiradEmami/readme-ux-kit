<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="terminal_cli_help_overviewTitle terminal_cli_help_overviewDesc">
  <title id="terminal_cli_help_overviewTitle">Cli Help Overview</title>
  <desc id="terminal_cli_help_overviewDesc">A README commands section explaining cli help overview. The exact generic command is tool --help. Its copyable Markdown equivalent is in docs/TERMINAL_PANEL_COMMANDS.md. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
  <g id="terminal_cli_help_overviewBase" data-edit-id="base" data-edit-label="Terminal window" data-edit-lock="true"><rect width="900" height="420" rx="18" fill="#08111f"/><rect x="24" y="24" width="852" height="372" rx="14" fill="#0b1525" stroke="#22d3ee" stroke-width="2"/><path d="M24 76H876" stroke="#22d3ee" opacity=".5"/><circle cx="52" cy="50" r="7" fill="#fb7185"/><circle cx="76" cy="50" r="7" fill="#fbbf24"/><circle cx="100" cy="50" r="7" fill="#34d399"/></g>
  <g id="terminal_cli_help_overviewHeader" data-edit-id="header" data-edit-label="Panel heading"><text id="terminal_cli_help_overviewLabel" data-edit-id="label" data-edit-label="Panel title" x="128" y="58" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Cli Help Overview</text><text x="820" y="56" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">SAMPLE SESSION</text></g>
  <g id="terminal_cli_help_overviewCommand" data-edit-id="command" data-edit-label="Editable command"><text x="54" y="130" font-family="'Courier New',Consolas,monospace" font-size="24" font-weight="700" fill="#22d3ee">$</text><text id="terminal_cli_help_overviewCommandText" data-edit-id="command-text" data-edit-label="Copyable command" x="82" y="130" font-family="'Courier New',Consolas,monospace" font-size="21" fill="#f8fafc">tool --help</text><rect x="82" y="145" width="14" height="3" fill="#22d3ee"><animate id="terminal_cli_help_overviewCursorMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="terminal_cli_help_overviewOutput" data-edit-id="output" data-edit-label="Illustrative output"><path d="M70 205V343" stroke="#22d3ee" stroke-width="3"/><circle cx="70" cy="220" r="7" fill="#22d3ee"/><circle cx="70" cy="258" r="7" fill="#22d3ee"/><circle cx="70" cy="296" r="7" fill="#22d3ee"/><circle cx="70" cy="334" r="7" fill="#22d3ee"/><text x="96" y="220" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] command accepted</text><text x="96" y="258" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] placeholder output</text><text x="96" y="296" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] review before use</text><text x="96" y="334" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#cbd5e1">[sample] no live status implied</text></g>
</svg>
