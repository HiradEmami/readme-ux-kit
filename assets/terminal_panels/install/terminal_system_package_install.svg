<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="terminal_system_package_installTitle terminal_system_package_installDesc">
  <title id="terminal_system_package_installTitle">System Package Install</title>
  <desc id="terminal_system_package_installDesc">A README install section explaining system package install. The exact generic command is pkg-manager install PACKAGE_NAME. Its copyable Markdown equivalent is in docs/TERMINAL_PANEL_COMMANDS.md. Static composition.</desc>
