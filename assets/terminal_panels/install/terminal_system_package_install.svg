  <g id="terminal_system_package_installHeader" data-edit-id="header" data-edit-label="Panel heading"><text id="terminal_system_package_installLabel" data-edit-id="label" data-edit-label="Panel title" x="128" y="58" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700" fill="#f8fafc">System Package Install</text><text x="820" y="56" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#cbd5e1">SAMPLE SESSION</text></g>
  <g id="terminal_system_package_installCommand" data-edit-id="command" data-edit-label="Editable command"><text x="54" y="130" font-family="'Courier New',Consolas,monospace" font-size="24" font-weight="700" fill="#22d3ee">$</text><text id="terminal_system_package_installCommandText" data-edit-id="command-text" data-edit-label="Copyable command" x="82" y="130" font-family="'Courier New',Consolas,monospace" font-size="21" fill="#f8fafc">pkg-manager install PACKAGE_NAME</text><rect x="82" y="145" width="14" height="3" fill="#22d3ee"></rect></g>
