  <title id="terminal_artifact_manifestTitle">Artifact Manifest</title>
  <desc id="terminal_artifact_manifestDesc">A README build section explaining artifact manifest. The exact generic command is tool artifact manifest. Its copyable Markdown equivalent is in docs/TERMINAL_PANEL_COMMANDS.md. Static composition.</desc>
