<svg viewBox="0 0 1200 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner_sparkle_twinkle-title banner_sparkle_twinkle-desc">
  <title id="banner_sparkle_twinkle-title">Banner Sparkle Twinkle</title>
  <desc id="banner_sparkle_twinkle-desc">An animated README SVG asset illustrating Banner Sparkle Twinkle.</desc>
  <rect width="1200" height="120" fill="#020617"/>

  <g fill="#22d3ee">
    <circle cx="200" cy="50" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="70" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
