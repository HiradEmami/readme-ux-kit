<svg viewBox="0 0 1200 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner_horizontal_drifting_particles-title banner_horizontal_drifting_particles-desc">
  <title id="banner_horizontal_drifting_particles-title">Banner Horizontal Drifting Particles</title>
  <desc id="banner_horizontal_drifting_particles-desc">An animated README SVG asset illustrating Banner Horizontal Drifting Particles.</desc>
  <rect width="1200" height="120" fill="#020617"/>

  <circle cy="40" r="2" fill="#22d3ee">
    <animate attributeName="cx" values="0;1200" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cy="80" r="2" fill="#8b5cf6">
    <animate attributeName="cx" values="1200;0" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
