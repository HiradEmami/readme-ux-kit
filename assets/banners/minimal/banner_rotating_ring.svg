<svg viewBox="0 0 1200 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner_rotating_ring-title banner_rotating_ring-desc">
  <title id="banner_rotating_ring-title">Banner Rotating Ring</title>
  <desc id="banner_rotating_ring-desc">An animated README SVG asset illustrating Banner Rotating Ring.</desc>
  <rect width="1200" height="120" fill="#020617"/>

  <circle cx="600" cy="60" r="30" stroke="#22d3ee" fill="none" stroke-dasharray="10 10">
    <animateTransform attributeName="transform" type="rotate"
      from="0 600 60" to="360 600 60" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
