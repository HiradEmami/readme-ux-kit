<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="visual_service_constellationTitle visual_service_constellationDesc">
  <title id="visual_service_constellationTitle">Visual Service Constellation</title>
  <desc id="visual_service_constellationDesc">A README architecture section explaining visual service constellation. Visual Service Constellation as a editorial technical metaphor. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="visual_service_constellationBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="1024" height="1024" rx="54" fill="#08111f"/><g id="visual_service_constellationHeading" data-edit-id="heading" data-edit-label="Heading"><text x="70" y="92" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#a78bfa">CONCEPTUAL README VISUAL</text><text x="70" y="142" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">SERVICE CONSTELLATION</text></g><g id="visual_service_constellationMap" data-edit-id="illustration" data-edit-label="Service constellation illustration"><g fill="none" stroke="#263b5b" stroke-width="6"><path d="M512 490 260 300M512 490 765 290M512 490 800 600M512 490 620 790M512 490 250 700M260 300 765 290 800 600 620 790 250 700Z"/></g><circle cx="512" cy="490" r="92" fill="#111c2e" stroke="#a78bfa" stroke-width="8"/><g fill="#08111f" stroke-width="7"><circle cx="260" cy="300" r="50" stroke="#22d3ee"/><circle cx="765" cy="290" r="50" stroke="#60a5fa"/><circle cx="800" cy="600" r="50" stroke="#34d399"/><circle cx="620" cy="790" r="50" stroke="#f59e0b"/><circle cx="250" cy="700" r="50" stroke="#fb7185"/></g><g fill="#f8fafc"><circle cx="512" cy="490" r="20"/><circle cx="260" cy="300" r="12"/><circle cx="765" cy="290" r="12"/><circle cx="800" cy="600" r="12"/><circle cx="620" cy="790" r="12"/><circle cx="250" cy="700" r="12"/></g></g><circle id="visual_service_constellationPulse" data-edit-id="motion" data-edit-label="Concept pulse" cx="512" cy="490" r="34" fill="none" stroke="#a78bfa" stroke-width="5"><animate id="visual_service_constellationMotion" attributeName="r" values="28;70;28" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.15;1" dur="4s" repeatCount="indefinite"/></circle>
