  <title id="visual_modular_cityTitle">Visual Modular City</title>
  <desc id="visual_modular_cityDesc">A README architecture section explaining visual modular city. Visual Modular City as a editorial technical metaphor. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
