<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="visual_agent_workbenchTitle visual_agent_workbenchDesc">
  <title id="visual_agent_workbenchTitle">Visual Agent Workbench</title>
  <desc id="visual_agent_workbenchDesc">A README agent ai section explaining visual agent workbench. Visual Agent Workbench as a editorial technical metaphor. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="visual_agent_workbenchBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="1024" height="1024" rx="54" fill="#08111f"/><g id="visual_agent_workbenchHeading" data-edit-id="heading" data-edit-label="Heading"><text x="70" y="92" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#34d399">CONCEPTUAL README VISUAL</text><text x="70" y="142" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">AGENT WORKBENCH</text></g><g id="visual_agent_workbenchSignal" data-edit-id="illustration" data-edit-label="Reliability signal illustration"><path d="M160 560h145l55-160 90 285 80-350 75 225h259" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="512" cy="510" r="175" fill="none" stroke="#263b5b" stroke-width="4" stroke-dasharray="10 14"/></g><circle id="visual_agent_workbenchPulse" data-edit-id="motion" data-edit-label="Concept pulse" cx="512" cy="500" r="15" fill="#34d399"><animate id="visual_agent_workbenchMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
