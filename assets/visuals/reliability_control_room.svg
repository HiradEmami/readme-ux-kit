<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Reliability control room visual">
  <defs>
    <linearGradient id="rely-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rely-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .rely-wave { animation: relyMove 3s linear infinite; }
      .rely-ok { animation: relyPulse 2s ease-in-out infinite; }
      @keyframes relyMove { to { stroke-dashoffset:-180; } }
      @keyframes relyPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="url(#rely-bg)"/>
