<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Deployment pipeline orbit visual">
  <defs>
    <linearGradient id="deploy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="deploy-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .deploy-dash { animation: deployDash 3s linear infinite; }
      .deploy-core { animation: deployPulse 2.6s ease-in-out infinite; transform-origin: center; }
      @keyframes deployDash { to { stroke-dashoffset:-180; } }
      @keyframes deployPulse { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="url(#deploy-bg)"/>
  <g transform="translate(512 512)" fill="none">
    <circle r="360" stroke="#1e293b" stroke-width="2"/>
    <circle class="deploy-dash" r="300" stroke="url(#deploy-track)" stroke-width="6" stroke-dasharray="62 48" opacity=".78"/>
    <circle class="deploy-dash" r="220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 36" opacity=".45"/>
  </g>
  <g fill="#0f172a" stroke-width="3">
    <rect x="124" y="454" width="146" height="116" rx="18" stroke="#22c55e"/>
    <rect x="439" y="124" width="146" height="116" rx="18" stroke="#38bdf8"/>
    <rect x="754" y="454" width="146" height="116" rx="18" stroke="#8b5cf6"/>
    <rect x="439" y="784" width="146" height="116" rx="18" stroke="#f472b6"/>
  </g>
  <g stroke="url(#deploy-track)" stroke-width="5" stroke-linecap="round" fill="none">
    <path class="deploy-dash" d="M270 512C350 256 674 256 754 512" stroke-dasharray="32 28"/>
    <path class="deploy-dash" d="M754 512C674 768 350 768 270 512" stroke-dasharray="32 28"/>
  </g>
  <g class="deploy-core">
    <circle cx="512" cy="512" r="98" fill="#22d3ee" opacity=".16"/>
    <circle cx="512" cy="512" r="58" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <path d="M486 512L506 532L544 488" fill="none" stroke="#bbf7d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
