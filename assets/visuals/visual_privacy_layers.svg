<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="visual_privacy_layersTitle visual_privacy_layersDesc">
  <title id="visual_privacy_layersTitle">Visual Privacy Layers</title>
  <desc id="visual_privacy_layersDesc">A README privacy section explaining visual privacy layers. Visual Privacy Layers as a editorial technical metaphor. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="visual_privacy_layersBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="1024" height="1024" rx="54" fill="#08111f"/><g id="visual_privacy_layersHeading" data-edit-id="heading" data-edit-label="Heading"><text x="70" y="92" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#f59e0b">CONCEPTUAL README VISUAL</text><text x="70" y="142" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">PRIVACY LAYERS</text></g><g id="visual_privacy_layersRings" data-edit-id="illustration" data-edit-label="Layered privacy boundary illustration"><rect x="145" y="230" width="734" height="560" rx="90" fill="#0f172a" stroke="#263b5b" stroke-width="7"/><rect x="225" y="295" width="574" height="430" rx="70" fill="#111c2e" stroke="#f59e0b" stroke-width="7"/><rect x="320" y="370" width="384" height="280" rx="52" fill="#08111f" stroke="#a78bfa" stroke-width="7"/><rect x="420" y="475" width="184" height="145" rx="25" fill="#111c2e" stroke="#f8fafc" stroke-width="6"/><path d="M457 475v-54c0-38 24-67 55-67s55 29 55 67v54" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/><circle cx="512" cy="545" r="22" fill="#f59e0b"/><g fill="#f59e0b"><circle cx="185" cy="510" r="12"/><circle cx="839" cy="510" r="12"/></g><path d="M197 510h28M799 510h28" stroke="#f59e0b" stroke-width="6"/></g><circle id="visual_privacy_layersPulse" data-edit-id="motion" data-edit-label="Concept pulse" cx="512" cy="545" r="12" fill="#f8fafc"><animate id="visual_privacy_layersMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
