<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Agent orchestration hub visual">
  <defs>
    <radialGradient id="agent-bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="70%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="agent-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .agent-spin { animation: agentSpin 42s linear infinite; transform-origin: 512px 512px; }
      .agent-hop { animation: agentHop 2.6s ease-in-out infinite; }
      @keyframes agentSpin { to { transform: rotate(360deg); } }
      @keyframes agentHop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>
  <rect width="1024" height="1024" fill="url(#agent-bg)"/>
  <g class="agent-spin" fill="none" stroke="#1e293b" stroke-width="2">
    <circle cx="512" cy="512" r="368"/>
    <circle cx="512" cy="512" r="278"/>
  </g>
  <g stroke="url(#agent-flow)" stroke-width="4" stroke-linecap="round" opacity=".75">
    <path d="M512 512L512 178M512 512L802 344M512 512L802 680M512 512L512 846M512 512L222 680M512 512L222 344"/>
  </g>
  <g fill="#0f172a" stroke="url(#agent-flow)" stroke-width="4">
    <circle cx="512" cy="512" r="90"/>
    <circle class="agent-hop" cx="512" cy="178" r="52"/>
    <circle class="agent-hop" cx="802" cy="344" r="52" style="animation-delay:.15s"/>
    <circle class="agent-hop" cx="802" cy="680" r="52" style="animation-delay:.3s"/>
    <circle class="agent-hop" cx="512" cy="846" r="52" style="animation-delay:.45s"/>
    <circle class="agent-hop" cx="222" cy="680" r="52" style="animation-delay:.6s"/>
    <circle class="agent-hop" cx="222" cy="344" r="52" style="animation-delay:.75s"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="512" cy="512" r="22"/>
    <circle cx="512" cy="178" r="10"/><circle cx="802" cy="344" r="10"/>
    <circle cx="802" cy="680" r="10"/><circle cx="512" cy="846" r="10"/>
    <circle cx="222" cy="680" r="10"/><circle cx="222" cy="344" r="10"/>
  </g>
</svg>
