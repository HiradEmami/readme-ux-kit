<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_spiffe_svid_rotation_lineTitle divider_spiffe_svid_rotation_lineDesc">
  <title id="divider_spiffe_svid_rotation_lineTitle">SPIFFE Identity Line</title>
  <desc id="divider_spiffe_svid_rotation_lineDesc">Animated README section divider for SPIFFE Identity Line with continuous signal motion.</desc>
  <g id="divider_spiffe_svid_rotation_lineBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#07101e"/></g>
  <g id="divider_spiffe_svid_rotation_lineTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#0f1d33" stroke-width="5"/><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 16"><animate id="divider_spiffe_svid_rotation_lineWaveFlow" attributeName="stroke-dashoffset" values="80;0" dur="4s" repeatCount="indefinite"/></path></g>
