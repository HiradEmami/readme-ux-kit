<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" height="40" role="img" aria-labelledby="divider_breathing_line-title divider_breathing_line-desc">
  <title id="divider_breathing_line-title">Divider Breathing Line</title>
  <desc id="divider_breathing_line-desc">An animated README SVG asset illustrating Divider Breathing Line.</desc>
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
