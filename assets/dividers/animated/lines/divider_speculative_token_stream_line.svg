<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_speculative_token_stream_lineTitle divider_speculative_token_stream_lineDesc">
  <title id="divider_speculative_token_stream_lineTitle">Speculative Token Line</title>
  <desc id="divider_speculative_token_stream_lineDesc">Animated README section divider for Speculative Token Line with continuous signal motion.</desc>
  <g id="divider_speculative_token_stream_lineBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#0e0b06"/></g>
  <g id="divider_speculative_token_stream_lineTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#1e170d" stroke-width="5"/><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 16"><animate id="divider_speculative_token_stream_lineWaveFlow" attributeName="stroke-dashoffset" values="80;0" dur="4s" repeatCount="indefinite"/></path></g>
