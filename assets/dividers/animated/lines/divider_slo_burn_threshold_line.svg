<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_slo_burn_threshold_lineTitle divider_slo_burn_threshold_lineDesc">
  <title id="divider_slo_burn_threshold_lineTitle">SLO Burn Threshold Line</title>
  <desc id="divider_slo_burn_threshold_lineDesc">Animated README section divider for SLO Burn Threshold Line with continuous signal motion.</desc>
  <g id="divider_slo_burn_threshold_lineBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#0a091a"/></g>
  <g id="divider_slo_burn_threshold_lineTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#151332" stroke-width="5"/><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 16"><animate id="divider_slo_burn_threshold_lineWaveFlow" attributeName="stroke-dashoffset" values="80;0" dur="4s" repeatCount="indefinite"/></path></g>
