<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_graphql_supergraph_threadTitle divider_graphql_supergraph_threadDesc">
  <title id="divider_graphql_supergraph_threadTitle">Supergraph Schema Thread</title>
  <desc id="divider_graphql_supergraph_threadDesc">Animated README section divider for Supergraph Schema Thread with continuous signal motion.</desc>
  <g id="divider_graphql_supergraph_threadBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#070c1b"/></g>
  <g id="divider_graphql_supergraph_threadTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#111936" stroke-width="5"/><path d="M24 40Q260 14 500 40T976 40" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 16"><animate id="divider_graphql_supergraph_threadWaveFlow" attributeName="stroke-dashoffset" values="80;0" dur="4s" repeatCount="indefinite"/></path></g>
