<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_tensor_bus_barTitle divider_tensor_bus_barDesc">
  <title id="divider_tensor_bus_barTitle">Tensor Bus Bar</title>
  <desc id="divider_tensor_bus_barDesc">Animated README section divider for Tensor Bus Bar with continuous signal motion.</desc>
  <g id="divider_tensor_bus_barBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#0e0b06"/></g>
  <g id="divider_tensor_bus_barTrack" data-edit-id="track" data-edit-label="Animated divider track"><rect x="30" y="34" width="940" height="12" rx="6" fill="#1e170d"/><path d="M40 40H960" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-dasharray="48 24"><animate id="divider_tensor_bus_barBarFlow" attributeName="stroke-dashoffset" values="144;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="divider_tensor_bus_barBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#1e170d" stroke="#f59e0b" stroke-width="1.5"/><text id="divider_tensor_bus_barTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">TENSOR BUS</text></g>
</svg>
