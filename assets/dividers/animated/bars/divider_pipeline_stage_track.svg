<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_pipeline_stage_trackTitle divider_pipeline_stage_trackDesc">
  <title id="divider_pipeline_stage_trackTitle">Pipeline Stage Track</title>
  <desc id="divider_pipeline_stage_trackDesc">Animated README section divider for Pipeline Stage Track with continuous signal motion.</desc>
  <g id="divider_pipeline_stage_trackBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#0a091a"/></g>
  <g id="divider_pipeline_stage_trackTrack" data-edit-id="track" data-edit-label="Animated divider track"><rect x="30" y="34" width="940" height="12" rx="6" fill="#151332"/><path d="M40 40H960" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-dasharray="48 24"><animate id="divider_pipeline_stage_trackBarFlow" attributeName="stroke-dashoffset" values="144;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="divider_pipeline_stage_trackBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#151332" stroke="#a78bfa" stroke-width="1.5"/><text id="divider_pipeline_stage_trackTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">STAGE TRACK</text></g>
</svg>
