<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_telemetry_cadence_barTitle divider_telemetry_cadence_barDesc">
  <title id="divider_telemetry_cadence_barTitle">Telemetry Cadence Bar</title>
  <desc id="divider_telemetry_cadence_barDesc">Animated README section divider for Telemetry Cadence Bar with continuous signal motion.</desc>
  <g id="divider_telemetry_cadence_barBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#061216"/></g>
  <g id="divider_telemetry_cadence_barTrack" data-edit-id="track" data-edit-label="Animated divider track"><rect x="30" y="34" width="940" height="12" rx="6" fill="#0c2229"/><path d="M40 40H960" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-dasharray="48 24"><animate id="divider_telemetry_cadence_barBarFlow" attributeName="stroke-dashoffset" values="144;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="divider_telemetry_cadence_barBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#0c2229" stroke="#2dd4bf" stroke-width="1.5"/><text id="divider_telemetry_cadence_barTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">TELEMETRY</text></g>
</svg>
