<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30" role="img" aria-labelledby="divider_digital_loading_bar-title divider_digital_loading_bar-desc">
  <title id="divider_digital_loading_bar-title">Divider Digital Loading Bar</title>
  <desc id="divider_digital_loading_bar-desc">An animated README SVG asset illustrating Divider Digital Loading Bar.</desc>
  <rect x="0" y="12" width="1000" height="6" fill="#1e293b"/>

  <rect x="0" y="12" height="6" fill="#22c55e">
    <animate attributeName="width" values="0;1000;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
