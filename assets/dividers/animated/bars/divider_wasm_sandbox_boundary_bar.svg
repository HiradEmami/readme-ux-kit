<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_wasm_sandbox_boundary_barTitle divider_wasm_sandbox_boundary_barDesc">
  <title id="divider_wasm_sandbox_boundary_barTitle">WASM Sandbox Boundary Bar</title>
  <desc id="divider_wasm_sandbox_boundary_barDesc">Animated README section divider for WASM Sandbox Boundary Bar with continuous signal motion.</desc>
  <g id="divider_wasm_sandbox_boundary_barBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#050f19"/></g>
  <g id="divider_wasm_sandbox_boundary_barTrack" data-edit-id="track" data-edit-label="Animated divider track"><rect x="30" y="34" width="940" height="12" rx="6" fill="#0c1f31"/><path d="M40 40H960" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="48 24"><animate id="divider_wasm_sandbox_boundary_barBarFlow" attributeName="stroke-dashoffset" values="144;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="divider_wasm_sandbox_boundary_barBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#0c1f31" stroke="#22d3ee" stroke-width="1.5"/><text id="divider_wasm_sandbox_boundary_barTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">WASM BOUND</text></g>
</svg>
