<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_edge_pop_backhaul_barTitle divider_edge_pop_backhaul_barDesc">
  <title id="divider_edge_pop_backhaul_barTitle">Edge POP Backhaul Bar</title>
  <desc id="divider_edge_pop_backhaul_barDesc">Animated README section divider for Edge POP Backhaul Bar with continuous signal motion.</desc>
  <g id="divider_edge_pop_backhaul_barBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#07101e"/></g>
  <g id="divider_edge_pop_backhaul_barTrack" data-edit-id="track" data-edit-label="Animated divider track"><rect x="30" y="34" width="940" height="12" rx="6" fill="#0f1d33"/><path d="M40 40H960" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="48 24"><animate id="divider_edge_pop_backhaul_barBarFlow" attributeName="stroke-dashoffset" values="144;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="divider_edge_pop_backhaul_barBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#0f1d33" stroke="#38bdf8" stroke-width="1.5"/><text id="divider_edge_pop_backhaul_barTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">BACKHAUL</text></g>
</svg>
