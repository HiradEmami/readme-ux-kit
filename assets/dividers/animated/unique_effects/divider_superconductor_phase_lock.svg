  <g id="divider_superconductor_phase_lockTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40H410L430 22H570L590 40H976" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="16 10"><animate id="divider_superconductor_phase_lockUniqueFlow" attributeName="stroke-dashoffset" values="52;0" dur="4s" repeatCount="indefinite"/></path><circle cx="380" cy="40" r="6" fill="#fda4af"><animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/></circle><circle cx="620" cy="40" r="6" fill="#38bdf8"><animate attributeName="r" values="8;4;8" dur="4s" repeatCount="indefinite"/></circle></g>
