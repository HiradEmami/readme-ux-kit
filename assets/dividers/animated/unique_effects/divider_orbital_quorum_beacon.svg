<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-labelledby="divider_orbital_quorum_beaconTitle divider_orbital_quorum_beaconDesc">
  <title id="divider_orbital_quorum_beaconTitle">Orbital Quorum Beacon</title>
  <desc id="divider_orbital_quorum_beaconDesc">Animated README section divider for Orbital Quorum Beacon with continuous signal motion.</desc>
  <g id="divider_orbital_quorum_beaconBase" data-edit-id="base" data-edit-label="Divider background" data-edit-lock="true"><rect x="0" y="0" width="1000" height="80" rx="14" fill="#06120b"/></g>
  <g id="divider_orbital_quorum_beaconTrack" data-edit-id="track" data-edit-label="Animated divider track"><path d="M24 40H410L430 22H570L590 40H976" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="16 10"><animate id="divider_orbital_quorum_beaconUniqueFlow" attributeName="stroke-dashoffset" values="52;0" dur="4s" repeatCount="indefinite"/></path><circle cx="380" cy="40" r="6" fill="#6ee7b7"><animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/></circle><circle cx="620" cy="40" r="6" fill="#fbbf24"><animate attributeName="r" values="8;4;8" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="divider_orbital_quorum_beaconBadge" data-edit-id="badge" data-edit-label="Center divider badge"><rect x="420" y="24" width="160" height="32" rx="16" fill="#0e2417" stroke="#34d399" stroke-width="1.5"/><text id="divider_orbital_quorum_beaconTagText" data-edit-id="tag-text" data-edit-label="Divider label" x="500" y="45" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="750" letter-spacing="1.2" fill="#f8fafc">ORBITAL</text></g>
</svg>
