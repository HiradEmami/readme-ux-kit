<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="button_sponsor_projectTitle button_sponsor_projectDesc">
  <title id="button_sponsor_projectTitle">Sponsor Project Button</title>
  <desc id="button_sponsor_projectDesc">A premium sponsorship button with a glowing heart emblem and a dedicated support callout.</desc>
  <defs><linearGradient id="button_sponsor_projectSurface" x1="8" y1="8" x2="312" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#4c0519"/><stop offset=".55" stop-color="#881337"/><stop offset="1" stop-color="#3b0764"/></linearGradient><filter id="button_sponsor_projectGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect id="button_sponsor_projectBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true" x="8" y="8" width="304" height="56" rx="18" fill="url(#button_sponsor_projectSurface)" stroke="#fb7185" stroke-width="2"/>
  <g id="button_sponsor_projectHeart" data-edit-id="icon" data-edit-label="Sponsor heart icon" filter="url(#button_sponsor_projectGlow)"><path d="M43 51S27 42 27 31a9 9 0 0 1 16-5 9 9 0 0 1 16 5c0 11-16 20-16 20Z" fill="#fb7185"><animate attributeName="opacity" values=".78;1;.78" dur="1.8s" repeatCount="indefinite"/></path><path d="m38 34 4 4 8-9" fill="none" stroke="#fff1f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text id="button_sponsor_projectLabel" data-edit-id="label" data-edit-label="Button label" x="76" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" fill="#fff1f2">Sponsor project</text>
  <g id="button_sponsor_projectMeta" data-edit-id="meta" data-edit-label="Support callout"><rect x="246" y="23" width="52" height="26" rx="13" fill="#be123c"/><text x="272" y="41" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="800" fill="#fff1f2">SUPPORT</text></g>
</svg>
