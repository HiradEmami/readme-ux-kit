<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="button_meet_maintainersTitle button_meet_maintainersDesc">
  <title id="button_meet_maintainersTitle">Meet Maintainers Button</title>
  <desc id="button_meet_maintainersDesc">A welcoming team button with three overlapping maintainer portraits and an online indicator.</desc>
  <rect id="button_meet_maintainersBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true" x="8" y="8" width="304" height="56" rx="28" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <g id="button_meet_maintainersTeam" data-edit-id="icon" data-edit-label="Maintainer portraits"><circle cx="31" cy="36" r="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><circle cx="45" cy="36" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="59" cy="36" r="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="31" cy="32" r="4" fill="#0891b2"/><path d="M24 43c2-6 12-6 14 0" stroke="#0891b2" stroke-width="2"/><circle cx="45" cy="32" r="4" fill="#2563eb"/><path d="M38 43c2-6 12-6 14 0" stroke="#2563eb" stroke-width="2"/><circle cx="59" cy="32" r="4" fill="#059669"/><path d="M52 43c2-6 12-6 14 0" stroke="#059669" stroke-width="2"/></g>
  <text id="button_meet_maintainersLabel" data-edit-id="label" data-edit-label="Button label" x="84" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="800" fill="#164e63">Meet maintainers</text>
  <g id="button_meet_maintainersStatus" data-edit-id="meta" data-edit-label="Team availability"><circle cx="285" cy="36" r="8" fill="#22c55e"/><circle cx="285" cy="36" r="13" fill="none" stroke="#86efac"><animate attributeName="r" values="8;14;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></circle></g>
</svg>
