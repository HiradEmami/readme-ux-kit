<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none" role="img" aria-labelledby="button_open_incident_updateTitle button_open_incident_updateDesc">
  <title id="button_open_incident_updateTitle">Open incident update status button</title>
  <desc id="button_open_incident_updateDesc">An urgent incident update control with a lit warning beacon, service interruption label, live waveform, and live indicator.</desc>
  <defs>
    <linearGradient id="button_open_incident_updateSurface" x1="8" y1="8" x2="312" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#240B16"/>
      <stop offset=".55" stop-color="#3B0D19"/>
      <stop offset="1" stop-color="#170B15"/>
    </linearGradient>
    <linearGradient id="button_open_incident_updateBeacon" x1="30" y1="25" x2="52" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <g id="button_open_incident_updateBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true">
    <rect x="8" y="8" width="304" height="56" rx="16" fill="url(#button_open_incident_updateSurface)" stroke="#FB7185" stroke-width="2"/>
    <path d="M24 63h272" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="button_open_incident_updateIcon" data-edit-id="icon" data-edit-label="Incident beacon icon">
    <path d="M28 46h29M32 46v-4h21v4" stroke="#FECDD3" stroke-width="2" stroke-linecap="round"/>
    <path d="M34 41v-7a9 9 0 0 1 18 0v7H34Z" fill="url(#button_open_incident_updateBeacon)"/>
    <path d="M38 35a5 5 0 0 1 5-5" stroke="#FFF1F2" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 22v-4M29 27l-3-3M57 27l3-3" stroke="#FB7185" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g id="button_open_incident_updateCopy" data-edit-id="copy" data-edit-label="Button copy">
    <text x="70" y="36" fill="#FFF1F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Incident update</text>
    <text x="71" y="49" fill="#FDA4AF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2">SERVICE INTERRUPTION</text>
  </g>
  <g id="button_open_incident_updateTelemetry" data-edit-id="telemetry" data-edit-label="Live incident telemetry">
    <path d="M225 37h5l3-7 5 14 5-19 5 12h8" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="264" y="25" width="34" height="22" rx="11" fill="#881337" stroke="#FB7185"/>
    <circle cx="273" cy="36" r="3" fill="#FFE4E6">
      <animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="280" y="39" fill="#FFF1F2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7" font-weight="800">LIVE</text>
  </g>
</svg>
