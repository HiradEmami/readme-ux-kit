<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none" role="img" aria-labelledby="button_maintenance_modeTitle button_maintenance_modeDesc">
  <title id="button_maintenance_modeTitle">Maintenance mode status button</title>
  <desc id="button_maintenance_modeDesc">A dark maintenance status control with an amber striped service icon, maintenance label, and paused state badge.</desc>
  <defs>
    <linearGradient id="button_maintenance_modeSurface" x1="8" y1="8" x2="312" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#292014"/>
    </linearGradient>
    <linearGradient id="button_maintenance_modeIcon" x1="24" y1="20" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <g id="button_maintenance_modeBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true">
    <rect x="8" y="8" width="304" height="56" rx="16" fill="url(#button_maintenance_modeSurface)" stroke="#F59E0B" stroke-width="2"/>
    <path d="M24 63h272" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>
  <g id="button_maintenance_modeIconGroup" data-edit-id="icon" data-edit-label="Maintenance icon">
    <rect x="23" y="19" width="38" height="34" rx="9" fill="url(#button_maintenance_modeIcon)"/>
    <path d="m27 47 8 6h8L27 40v7Zm0-14 25 20h5v-7L29 24h-2v9Zm12-14 18 14v-9l-7-5H39Z" fill="#3A2A12" opacity=".92"/>
    <rect x="38" y="28" width="4" height="16" rx="2" fill="#FFF7D6"/>
    <rect x="46" y="28" width="4" height="16" rx="2" fill="#FFF7D6"/>
  </g>
  <g id="button_maintenance_modeCopy" data-edit-id="copy" data-edit-label="Button copy">
    <text x="76" y="40" fill="#FFF7D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Maintenance mode</text>
    <text x="77" y="52" fill="#FBBF24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.3">SCHEDULED SERVICE</text>
  </g>
  <g id="button_maintenance_modeState" data-edit-id="state" data-edit-label="Paused state">
    <rect x="258" y="25" width="40" height="22" rx="11" fill="#422F12" stroke="#F59E0B"/>
    <circle cx="269" cy="36" r="3" fill="#FCD34D">
      <animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="276" y="39" fill="#FDE68A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7" font-weight="800">PAUSE</text>
  </g>
</svg>
