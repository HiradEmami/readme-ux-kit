<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="button_open_playgroundTitle button_open_playgroundDesc">
  <title id="button_open_playgroundTitle">Open Playground Button</title>
  <desc id="button_open_playgroundDesc">A luminous experiment button with a laboratory flask, orbiting sample, and run control.</desc>
  <defs><linearGradient id="button_open_playgroundSurface" x1="8" y1="8" x2="312" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#2e1065"/><stop offset=".55" stop-color="#4c1d95"/><stop offset="1" stop-color="#0f172a"/></linearGradient><filter id="button_open_playgroundGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect id="button_open_playgroundBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true" x="8" y="8" width="304" height="56" rx="16" fill="url(#button_open_playgroundSurface)" stroke="#a78bfa" stroke-width="2"/>
  <g id="button_open_playgroundFlask" data-edit-id="icon" data-edit-label="Playground flask icon" filter="url(#button_open_playgroundGlow)"><path d="M36 20h16M40 20v12L30 50h28L48 32V20" fill="none" stroke="#ddd6fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 43h18" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="38" r="3" fill="#22d3ee"/></g>
  <text id="button_open_playgroundLabel" data-edit-id="label" data-edit-label="Button label" x="76" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" fill="#faf5ff">Open playground</text>
  <g id="button_open_playgroundRun" data-edit-id="meta" data-edit-label="Run control"><circle cx="281" cy="36" r="15" fill="#7c3aed" stroke="#c4b5fd"/><path d="m277 29 10 7-10 7Z" fill="#fff"/></g>
</svg>
