<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="button_browse_examplesTitle button_browse_examplesDesc">
  <title id="button_browse_examplesTitle">Browse Examples Button</title>
  <desc id="button_browse_examplesDesc">A layered gallery button with four example tiles, a clear label, and a compact item count.</desc>
  <defs>
    <linearGradient id="button_browse_examplesSurface" x1="8" y1="8" x2="312" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
  </defs>
  <rect id="button_browse_examplesBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true" x="8" y="8" width="304" height="56" rx="16" fill="url(#button_browse_examplesSurface)" stroke="#60a5fa" stroke-width="2"/>
  <g id="button_browse_examplesGallery" data-edit-id="icon" data-edit-label="Example gallery icon"><rect x="26" y="20" width="38" height="32" rx="7" fill="#08111f" stroke="#93c5fd" stroke-width="2"/><rect x="31" y="25" width="11" height="9" rx="2" fill="#22d3ee"/><rect x="47" y="25" width="11" height="9" rx="2" fill="#a78bfa"/><rect x="31" y="39" width="11" height="8" rx="2" fill="#34d399"/><rect x="47" y="39" width="11" height="8" rx="2" fill="#60a5fa"/></g>
  <text id="button_browse_examplesLabel" data-edit-id="label" data-edit-label="Button label" x="78" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" fill="#eff6ff">Browse examples</text>
  <g id="button_browse_examplesMeta" data-edit-id="meta" data-edit-label="Example count"><rect x="260" y="23" width="36" height="26" rx="13" fill="#1e3a8a"/><text x="278" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="800" fill="#bfdbfe">24</text></g>
</svg>
