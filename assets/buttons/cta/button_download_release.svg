<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="button_download_releaseTitle button_download_releaseDesc">
  <title id="button_download_releaseTitle">Download Release Button</title>
  <desc id="button_download_releaseDesc">A release-package button with a download tray, version chip, and animated transfer marker.</desc>
  <defs><linearGradient id="button_download_releaseSurface" x1="10" y1="10" x2="310" y2="62" gradientUnits="userSpaceOnUse"><stop stop-color="#06283a"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect id="button_download_releaseBackground" data-edit-id="background" data-edit-label="Button background" data-edit-lock="true" x="8" y="8" width="304" height="56" rx="13" fill="url(#button_download_releaseSurface)" stroke="#22d3ee" stroke-width="2"/>
  <g id="button_download_releasePackage" data-edit-id="icon" data-edit-label="Release package icon"><path d="m27 28 17-8 17 8v19l-17 8-17-8Z" fill="#0c4a6e" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/><path d="m27 28 17 8 17-8M44 36v19M44 17v13m-5-5 5 5 5-5" fill="none" stroke="#cffafe" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".55;1;.55" dur="1.8s" repeatCount="indefinite"/></path></g>
  <text id="button_download_releaseLabel" data-edit-id="label" data-edit-label="Button label" x="76" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="800" fill="#ecfeff">Download release</text>
  <g id="button_download_releaseVersion" data-edit-id="meta" data-edit-label="Release version"><rect x="252" y="24" width="45" height="24" rx="7" fill="#083344" stroke="#155e75"/><text x="274.5" y="40" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="800" fill="#67e8f9">v2.4</text></g>
</svg>
