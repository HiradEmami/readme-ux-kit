<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="850" height="90" role="img" aria-label="Changelog file header">
  <defs>
    <linearGradient id="changelog-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="changelog-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="848" height="88" rx="10" fill="#03120f" stroke="#064e3b" stroke-width="2"/>
  <g transform="translate(36 45)" fill="none" stroke="#34d399" stroke-width="3" filter="url(#changelog-glow)">
    <circle r="18"/>
    <path d="M0 -10V2L9 9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="76" y="58" font-family="'Courier New', Consolas, monospace" font-size="42" font-weight="700" fill="url(#changelog-gradient)">CHANGELOG.md</text>
  <path d="M542 45H810" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 10" opacity=".75">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.2s" repeatCount="indefinite"/>
  </path>
</svg>
