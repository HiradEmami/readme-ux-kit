    <rect x="55" y="31" width="7" height="7" rx="1"/>
    <rect x="55" y="49" width="7" height="7" rx="1"/>
    <path d="M69 35H78M69 53H78"/>
  </g>
  <text id="testingLabel" data-edit-id="label" data-edit-label="Document title" x="119" y="57" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="34" font-weight="750" fill="#23292e">TESTING</text>
