    <rect x="1" y="1" width="848" height="88" rx="8" fill="#ffffff" stroke="#cdd2d5"/>
  </g>
  <g id="testingChecklist" data-edit-id="checklist" data-edit-label="Test checklist" fill="none" stroke="#3b4650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
