<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" role="img" aria-labelledby="testingTitle testingDesc">
  <title id="testingTitle">Testing</title>
  <desc id="testingDesc">An open checklist and three outlined test cases introduce testing instructions. Empty boxes describe work to run, without claiming passing results. Static illustration.</desc>
