<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="850" height="90" role="img" aria-label="Installation file header">
  <defs>
    <linearGradient id="install-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="850" height="90" rx="10" fill="#02110c"/>
  <g transform="translate(44 45)">
