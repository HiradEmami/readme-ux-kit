    <animate attributeName="d" values="M24 68H150;M260 68H430;M650 68H826;M24 68H150" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <text x="36" y="55" font-family="'Courier New', Consolas, monospace" font-size="42" font-weight="700" fill="url(#release-gradient)" filter="url(#release-glow)">RELEASE_NOTES.md</text>
  <circle cx="782" cy="35" r="9" fill="#f59e0b">
