<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="850" height="90" role="img" aria-label="FAQ file header">
  <defs>
    <linearGradient id="faq-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="850" height="90" rx="10" fill="#10051a"/>
  <g transform="translate(32 18)">
    <rect width="42" height="28" rx="7" fill="#1e1b4b" stroke="#c084fc"/>
    <rect x="20" y="26" width="42" height="28" rx="7" fill="#082f49" stroke="#38bdf8"/>
    <text x="13" y="21" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f5d0fe">?</text>
    <text x="33" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#bae6fd">!</text>
    <animateTransform attributeName="transform" type="translate" values="32 18;32 14;32 18" dur="2s" repeatCount="indefinite"/>
  </g>
  <text x="118" y="58" font-family="'Courier New', Consolas, monospace" font-size="42" font-weight="700" fill="url(#faq-gradient)">FAQ.md</text>
  <g opacity=".75">
    <circle cx="508" cy="45" r="4" fill="#f472b6"><animate attributeName="cy" values="45;30;45" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="536" cy="45" r="4" fill="#c084fc"><animate attributeName="cy" values="45;30;45" dur="1.6s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="564" cy="45" r="4" fill="#38bdf8"><animate attributeName="cy" values="45;30;45" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
