<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_wasm_isolate_coldbootTitle loading_wasm_isolate_coldbootDesc">
  <title id="loading_wasm_isolate_coldbootTitle">WASM Isolate Cold Boot</title>
  <desc id="loading_wasm_isolate_coldbootDesc">Animated loading indicator for WASM Isolate Cold Boot (BOOTING).</desc>
  <g id="loading_wasm_isolate_coldbootBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#11070d"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#23101a" stroke="#fb7185" stroke-width="1.8"/></g>
  <g id="loading_wasm_isolate_coldbootSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><circle cx="52" cy="50" r="24" fill="none" stroke="#11070d" stroke-width="5"/><circle cx="52" cy="50" r="24" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-dasharray="42 110"><animateTransform id="loading_wasm_isolate_coldbootSpin" attributeName="transform" type="rotate" from="0 52 50" to="360 52 50" dur="3s" repeatCount="indefinite"/></circle><circle cx="52" cy="50" r="8" fill="#fda4af"><animate id="loading_wasm_isolate_coldbootPulse" attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/></circle></g>
  <g id="loading_wasm_isolate_coldbootCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_wasm_isolate_coldbootState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">BOOTING</text><text id="loading_wasm_isolate_coldbootSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">WASM Isolate Cold Bo</text></g>
</svg>
