<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_hnsw_graph_traversalTitle loading_hnsw_graph_traversalDesc">
  <title id="loading_hnsw_graph_traversalTitle">HNSW Graph Traversal</title>
  <desc id="loading_hnsw_graph_traversalDesc">Animated loading indicator for HNSW Graph Traversal (SEARCHING).</desc>
  <g id="loading_hnsw_graph_traversalBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#070c1b"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#111936" stroke="#60a5fa" stroke-width="1.8"/></g>
  <g id="loading_hnsw_graph_traversalSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><polygon points="52,24 76,38 76,62 52,76 28,62 28,38" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-dasharray="16 10"><animate id="loading_hnsw_graph_traversalHexFlow" attributeName="stroke-dashoffset" values="52;0" dur="3s" repeatCount="indefinite"/></polygon><circle cx="52" cy="50" r="9" fill="#a78bfa"/></g>
  <g id="loading_hnsw_graph_traversalCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_hnsw_graph_traversalState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">SEARCHING</text><text id="loading_hnsw_graph_traversalSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">HNSW Graph Traversal</text></g>
</svg>
