  <desc>An animated README SVG asset illustrating Loading Sliding Bar.</desc>
  <rect width="20" height="10" y="5" fill="#22d3ee">
    <animate attributeName="x" values="0;100;0" dur="1.5s" repeatCount="indefinite"/>
