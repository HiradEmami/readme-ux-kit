<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="loading_rotating_dash-title loading_rotating_dash-desc">
  <title id="loading_rotating_dash-title">Loading Rotating Dash</title>
  <desc id="loading_rotating_dash-desc">An animated README SVG asset illustrating Loading Rotating Dash.</desc>
  <circle cx="40" cy="40" r="24" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate"
      from="0 40 40" to="360 40 40" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
