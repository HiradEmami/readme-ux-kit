<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_anycast_bgp_convergerTitle loading_anycast_bgp_convergerDesc">
  <title id="loading_anycast_bgp_convergerTitle">Anycast BGP Converger</title>
  <desc id="loading_anycast_bgp_convergerDesc">Animated loading indicator for Anycast BGP Converger (ROUTING).</desc>
  <g id="loading_anycast_bgp_convergerBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#11070d"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#23101a" stroke="#fb7185" stroke-width="1.8"/></g>
  <g id="loading_anycast_bgp_convergerSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><circle cx="52" cy="50" r="24" fill="none" stroke="#11070d" stroke-width="5"/><circle cx="52" cy="50" r="24" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-dasharray="42 110"><animateTransform id="loading_anycast_bgp_convergerSpin" attributeName="transform" type="rotate" from="0 52 50" to="360 52 50" dur="3s" repeatCount="indefinite"/></circle><circle cx="52" cy="50" r="8" fill="#fda4af"><animate id="loading_anycast_bgp_convergerPulse" attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/></circle></g>
  <g id="loading_anycast_bgp_convergerCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_anycast_bgp_convergerState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">ROUTING</text><text id="loading_anycast_bgp_convergerSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Anycast BGP Converge</text></g>
</svg>
