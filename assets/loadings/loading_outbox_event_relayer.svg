<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_outbox_event_relayerTitle loading_outbox_event_relayerDesc">
  <title id="loading_outbox_event_relayerTitle">Outbox Event Relayer</title>
  <desc id="loading_outbox_event_relayerDesc">Animated loading indicator for Outbox Event Relayer (RELAYING).</desc>
  <g id="loading_outbox_event_relayerBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#050f19"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="1.8"/></g>
  <g id="loading_outbox_event_relayerSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><circle cx="34" cy="50" r="7" fill="#22d3ee"><animate id="loading_outbox_event_relayerDot1" attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="52" cy="50" r="7" fill="#67e8f9"><animate attributeName="r" values="9;5;9" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="70" cy="50" r="7" fill="#818cf8"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle></g>
  <g id="loading_outbox_event_relayerCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_outbox_event_relayerState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">RELAYING</text><text id="loading_outbox_event_relayerSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Outbox Event Relayer</text></g>
</svg>
