<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_grpc_stream_multiplexerTitle loading_grpc_stream_multiplexerDesc">
  <title id="loading_grpc_stream_multiplexerTitle">gRPC Stream Multiplexer</title>
  <desc id="loading_grpc_stream_multiplexerDesc">Animated loading indicator for gRPC Stream Multiplexer (STREAMING).</desc>
  <g id="loading_grpc_stream_multiplexerBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#061216"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#0c2229" stroke="#2dd4bf" stroke-width="1.8"/></g>
  <g id="loading_grpc_stream_multiplexerSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><g fill="#2dd4bf"><rect x="28" y="34" width="10" height="32" rx="4"><animate id="loading_grpc_stream_multiplexerBar1" attributeName="height" values="16;36;16" dur="2.4s" repeatCount="indefinite"/></rect><rect x="44" y="28" width="10" height="44" rx="4"><animate attributeName="height" values="44;18;44" dur="2.4s" repeatCount="indefinite"/></rect><rect x="60" y="36" width="10" height="28" rx="4"><animate attributeName="height" values="20;40;20" dur="2.4s" repeatCount="indefinite"/></rect></g></g>
  <g id="loading_grpc_stream_multiplexerCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_grpc_stream_multiplexerState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">STREAMING</text><text id="loading_grpc_stream_multiplexerSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">gRPC Stream Multiple</text></g>
</svg>
