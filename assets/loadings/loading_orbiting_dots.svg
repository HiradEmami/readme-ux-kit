<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="loading_orbiting_dots-title loading_orbiting_dots-desc">
  <title id="loading_orbiting_dots-title">Loading Orbiting Dots</title>
  <desc id="loading_orbiting_dots-desc">An animated README SVG asset illustrating Loading Orbiting Dots.</desc>
  <circle cx="40" cy="40" r="4" fill="#f8fafc"/>
  <circle cx="40" cy="20" r="5" fill="#22d3ee">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 40 40"
                      to="360 40 40"
                      dur="1.4s"
                      repeatCount="indefinite"/>
  </circle>
</svg>
