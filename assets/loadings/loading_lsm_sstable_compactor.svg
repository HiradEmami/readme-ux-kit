<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_lsm_sstable_compactorTitle loading_lsm_sstable_compactorDesc">
  <title id="loading_lsm_sstable_compactorTitle">LSM SSTable Compactor</title>
  <desc id="loading_lsm_sstable_compactorDesc">Animated loading indicator for LSM SSTable Compactor (COMPACTING).</desc>
  <g id="loading_lsm_sstable_compactorBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#0e0b06"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#1e170d" stroke="#f59e0b" stroke-width="1.8"/></g>
  <g id="loading_lsm_sstable_compactorSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><circle cx="34" cy="50" r="7" fill="#f59e0b"><animate id="loading_lsm_sstable_compactorDot1" attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="52" cy="50" r="7" fill="#fbbf24"><animate attributeName="r" values="9;5;9" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="70" cy="50" r="7" fill="#38bdf8"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle></g>
  <g id="loading_lsm_sstable_compactorCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_lsm_sstable_compactorState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">COMPACTING</text><text id="loading_lsm_sstable_compactorSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">LSM SSTable Compacto</text></g>
</svg>
