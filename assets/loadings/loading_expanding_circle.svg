<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="loading_expanding_circle-title loading_expanding_circle-desc">
  <title id="loading_expanding_circle-title">Loading Expanding Circle</title>
  <desc id="loading_expanding_circle-desc">An animated README SVG asset illustrating Loading Expanding Circle.</desc>
  <circle cx="40" cy="40" r="10" fill="#22d3ee">
    <animate attributeName="r" values="10;20;10" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
