<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-labelledby="loading_monorepo_cache_hydratorTitle loading_monorepo_cache_hydratorDesc">
  <title id="loading_monorepo_cache_hydratorTitle">Monorepo Cache Hydrator</title>
  <desc id="loading_monorepo_cache_hydratorDesc">Animated loading indicator for Monorepo Cache Hydrator (HYDRATING).</desc>
  <g id="loading_monorepo_cache_hydratorBase" data-edit-id="base" data-edit-label="Loader background" data-edit-lock="true"><rect x="0" y="0" width="240" height="100" rx="18" fill="#0a091a"/><rect x="8" y="8" width="224" height="84" rx="14" fill="#151332" stroke="#a78bfa" stroke-width="1.8"/></g>
  <g id="loading_monorepo_cache_hydratorSpinner" data-edit-id="spinner" data-edit-label="Animated loading motif"><polygon points="52,24 76,38 76,62 52,76 28,62 28,38" fill="none" stroke="#a78bfa" stroke-width="3.5" stroke-dasharray="16 10"><animate id="loading_monorepo_cache_hydratorHexFlow" attributeName="stroke-dashoffset" values="52;0" dur="3s" repeatCount="indefinite"/></polygon><circle cx="52" cy="50" r="9" fill="#f472b6"/></g>
  <g id="loading_monorepo_cache_hydratorCopy" data-edit-id="copy" data-edit-label="Loader status text"><text id="loading_monorepo_cache_hydratorState" data-edit-id="state" data-edit-label="Active state label" x="96" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#f8fafc">HYDRATING</text><text id="loading_monorepo_cache_hydratorSub" data-edit-id="sub" data-edit-label="Loader title" x="96" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Monorepo Cache Hydra</text></g>
</svg>
