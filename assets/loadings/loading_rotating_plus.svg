<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="loading_rotating_plus-title loading_rotating_plus-desc">
  <title id="loading_rotating_plus-title">Loading Rotating Plus</title>
  <desc id="loading_rotating_plus-desc">An animated README SVG asset illustrating Loading Rotating Plus.</desc>
  <g>
    <line x1="40" y1="20" x2="40" y2="60" stroke="#f43f5e" stroke-width="4"/>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#f43f5e" stroke-width="4"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 40 40" to="360 40 40" dur="1.5s" repeatCount="indefinite"/>
  </g>
</svg>
