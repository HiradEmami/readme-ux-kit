<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="90" role="img" aria-labelledby="loading_rotating_blue_dashlines-title loading_rotating_blue_dashlines-desc">
  <title id="loading_rotating_blue_dashlines-title">Loading Rotating Blue Dashlines</title>
  <desc id="loading_rotating_blue_dashlines-desc">An animated README SVG asset illustrating Loading Rotating Blue Dashlines.</desc>
  <circle cx="60" cy="60" r="35" stroke="#22d3ee" stroke-width="4" fill="none"
    stroke-dasharray="10 15">
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
