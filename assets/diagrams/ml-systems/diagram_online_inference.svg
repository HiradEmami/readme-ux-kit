  <title id="diagram_online_inferenceTitle">Online Inference</title>
  <desc id="diagram_online_inferenceDesc">A README ml systems section explaining online inference. A calm signal indicates direction while all information remains visible.</desc>
  <defs><marker id="diagram_online_inferenceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#22d3ee"/></marker></defs>
  <g id="diagram_online_inferenceBase" data-edit-id="base" data-edit-label="Diagram background" data-edit-lock="true"><rect width="1000" height="600" rx="20" fill="#08111f"/><rect x="30" y="25" width="940" height="550" rx="16" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".22"/></g>
