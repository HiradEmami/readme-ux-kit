<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram_layered_service_stackTitle diagram_layered_service_stackDesc">
  <title id="diagram_layered_service_stackTitle">Layered Service Stack</title>
  <desc id="diagram_layered_service_stackDesc">A README architecture section explaining layered service stack. A calm signal indicates direction while all information remains visible.</desc>
  <defs><marker id="diagram_layered_service_stackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#22d3ee"/></marker></defs>
  <g id="diagram_layered_service_stackBase" data-edit-id="base" data-edit-label="Diagram background" data-edit-lock="true"><rect width="1000" height="600" rx="20" fill="#08111f"/><rect x="30" y="25" width="940" height="550" rx="16" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".22"/></g>
  <g id="diagram_layered_service_stackHeading" data-edit-id="heading" data-edit-label="Diagram heading"><text id="diagram_layered_service_stackLabel" data-edit-id="label" data-edit-label="Diagram title" x="60" y="70" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="750" fill="#f8fafc">Layered Service Stack</text><text id="diagram_layered_service_stackContext" data-edit-id="context" data-edit-label="Diagram context" x="60" y="101" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#cbd5e1">REFERENCE MODEL · ARCHITECTURE</text></g>
  <g id="diagram_layered_service_stackConnectors" data-edit-id="connectors" data-edit-label="Directional connectors" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" marker-end="url(#diagram_layered_service_stackArrow)"><path d="M120 235L310 235" stroke-dasharray="10 8"><animate id="diagram_layered_service_stackSignalMotion" attributeName="stroke-dashoffset" values="0;-36" dur="4s" repeatCount="indefinite"/></path><path d="M310 235L500 235" ></path><path d="M500 235L690 235" ></path><path d="M690 235L850 235" ></path></g>
  <g id="diagram_layered_service_stackNodes" data-edit-id="nodes" data-edit-label="System nodes"><g id="diagram_layered_service_stackNode0" data-edit-id="node-0" data-edit-label="LAYERED node"><rect x="48" y="200" width="144" height="70" rx="8" fill="#111c2e" stroke="#60a5fa" stroke-width="2"/><text x="120" y="241" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">LAYERED</text></g><g id="diagram_layered_service_stackNode1" data-edit-id="node-1" data-edit-label="SERVICE node"><rect x="238" y="200" width="144" height="70" rx="13" fill="#111c2e" stroke="#60a5fa" stroke-width="2"/><text x="310" y="241" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">SERVICE</text></g><g id="diagram_layered_service_stackNode2" data-edit-id="node-2" data-edit-label="STACK node"><rect x="428" y="200" width="144" height="70" rx="18" fill="#111c2e" stroke="#22d3ee" stroke-width="3"/><text x="500" y="241" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">STACK</text></g><g id="diagram_layered_service_stackNode3" data-edit-id="node-3" data-edit-label="LAYERED node"><rect x="618" y="200" width="144" height="70" rx="8" fill="#111c2e" stroke="#60a5fa" stroke-width="2"/><text x="690" y="241" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">LAYERED</text></g><g id="diagram_layered_service_stackNode4" data-edit-id="node-4" data-edit-label="SERVICE node"><rect x="778" y="200" width="144" height="70" rx="13" fill="#111c2e" stroke="#60a5fa" stroke-width="2"/><text x="850" y="241" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">SERVICE</text></g></g>
