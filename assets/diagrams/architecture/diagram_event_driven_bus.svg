  <g id="diagram_event_driven_busBase" data-edit-id="base" data-edit-label="Diagram background" data-edit-lock="true"><rect width="1000" height="600" rx="20" fill="#08111f"/><rect x="30" y="25" width="940" height="550" rx="16" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".22"/></g>
