<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="workflow_triage_impactTitle workflow_triage_impactDesc">
  <title id="workflow_triage_impactTitle">Triage Impact</title>
