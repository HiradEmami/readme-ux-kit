nt-size="11" fill="#cbd5e1">PASSED</text></g><g id="workflow_train_candidateStage1" data-edit-id="stage-1" data-edit-label="passed stage"><circle cx="330" cy="90" r="23" fill="#111c2e" stroke="#34d399" stroke-width="3"/><path d="m321 90 7 7 13-15" fill="none" stroke="#34d399" stroke-width="4"/><text x="330" y="138" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">CANDIDATE</text><text x="330" y="158" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1">PASSED</text></g><g id="workflow_train_candidateStage2" data-edit-id="stage-2" data-edit-label="active stage"><circle cx="330" cy="210" r="25" fill="#60a5fa" opacity=".22"/><circle cx="330" cy="210" r="15" fill="#60a5fa"/><circle cx="330" cy="210" r="31" fill="none" stroke="#60a5fa" stroke-width="2"><animate id="workflow_train_candidateActiveMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle><text x="330" y="258" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">TRAIN</text><text x="330" y="278" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1">ACTIVE</text></g><g id="workflow_train_candidateStage3" data-edit-id="stage-3" data-edit-label="queued stage"><circle cx="600" cy="150" r="23" fill="#111c2e" stroke="#cbd5e1" stroke-width="3"/><path d="M592 150H608" stroke="#cbd5e1" stroke-width="3"/><text x="600" y="198" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">CANDIDATE</text><text x="600" y="218" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1">QUEUED</text></g><g id="workflow_train_candidateStage4" data-edit-id="stage-4" data-edit-label="skipped stage"><circle cx="850" cy="150" r="23" fill="#