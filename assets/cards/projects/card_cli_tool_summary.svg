<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="card_cli_tool_summaryTitle card_cli_tool_summaryDesc">
  <title id="card_cli_tool_summaryTitle">Cli Tool Summary</title>
  <desc id="card_cli_tool_summaryDesc">A README projects section explaining cli tool summary. A calm signal indicates direction while all information remains visible.</desc>
  <g id="card_cli_tool_summaryBase" data-edit-id="base" data-edit-label="Card background" data-edit-lock="true"><rect width="640" height="240" rx="20" fill="#08111f"/><rect x="16" y="16" width="608" height="208" rx="16" fill="#111c2e" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="card_cli_tool_summaryCopy" data-edit-id="copy" data-edit-label="Editable card copy"><text id="card_cli_tool_summaryEyebrow" data-edit-id="eyebrow" data-edit-label="Card category" x="40" y="54" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">PROJECTS · SAMPLE</text><text id="card_cli_tool_summaryLabel" data-edit-id="label" data-edit-label="Card title" x="40" y="100" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750" fill="#f8fafc">Cli Tool Summary</text><text id="card_cli_tool_summarySummary" data-edit-id="summary" data-edit-label="Card summary" x="40" y="135" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#cbd5e1">Editable summary for project-specific details.</text><path d="M40 172H330" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><text x="40" y="201" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">ILLUSTRATIVE CONTENT</text></g>
  <g id="card_cli_tool_summaryVisual" data-edit-id="visual" data-edit-label="Card illustration"><g fill="none" stroke="#22d3ee" stroke-width="3"><rect x="420" y="74" width="66" height="48" rx="8"/><rect x="506" y="74" width="66" height="48" rx="8"/><rect x="463" y="140" width="66" height="48" rx="8"/></g><circle cx="590" cy="38" r="7" fill="#22d3ee"><animate id="card_cli_tool_summaryPulseMotion" attributeName="opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>
