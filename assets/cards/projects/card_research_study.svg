<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="card_research_studyTitle card_research_studyDesc">
  <title id="card_research_studyTitle">Research Study</title>
  <desc id="card_research_studyDesc">A README projects section explaining research study. A calm signal indicates direction while all information remains visible.</desc>
  <g id="card_research_studyBase" data-edit-id="base" data-edit-label="Card background" data-edit-lock="true"><rect width="640" height="240" rx="20" fill="#08111f"/><rect x="16" y="16" width="608" height="208" rx="16" fill="#111c2e" stroke="#34d399" stroke-width="2"/></g>
  <g id="card_research_studyCopy" data-edit-id="copy" data-edit-label="Editable card copy"><text id="card_research_studyEyebrow" data-edit-id="eyebrow" data-edit-label="Card category" x="40" y="54" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">PROJECTS · SAMPLE</text><text id="card_research_studyLabel" data-edit-id="label" data-edit-label="Card title" x="40" y="100" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750" fill="#f8fafc">Research Study</text><text id="card_research_studySummary" data-edit-id="summary" data-edit-label="Card summary" x="40" y="135" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#cbd5e1">Editable summary for project-specific details.</text><path d="M40 172H330" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><text x="40" y="201" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">ILLUSTRATIVE CONTENT</text></g>
  <g id="card_research_studyVisual" data-edit-id="visual" data-edit-label="Card illustration"><path d="M446 78H558L586 120 558 162H446L418 120Z" fill="none" stroke="#34d399" stroke-width="3"/><circle cx="502" cy="120" r="18" fill="#34d399"/><circle cx="590" cy="38" r="7" fill="#34d399"><animate id="card_research_studyPulseMotion" attributeName="opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>
