<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="card_deterministic_replay_engineTitle card_deterministic_replay_engineDesc">
  <title id="card_deterministic_replay_engineTitle">Deterministic Replay</title>
  <desc id="card_deterministic_replay_engineDesc">Animated README features card for Deterministic Replay. Time-travel debugging with bit-exact event journal reconstruction.</desc>
  <g id="card_deterministic_replay_engineBase" data-edit-id="base" data-edit-label="Card background" data-edit-lock="true"><rect x="0" y="0" width="640" height="240" rx="20" fill="#061216"/><rect x="16" y="16" width="608" height="208" rx="16" fill="#0c2229" stroke="#2dd4bf" stroke-width="2"/></g>
  <g id="card_deterministic_replay_engineCopy" data-edit-id="copy" data-edit-label="Editable card copy"><text id="card_deterministic_replay_engineEyebrow" data-edit-id="eyebrow" data-edit-label="Card category" x="40" y="54" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#6ee7b7">FEATURES · LIVE SIGNAL</text><text id="card_deterministic_replay_engineLabel" data-edit-id="label" data-edit-label="Card title" x="40" y="96" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="750" fill="#f8fafc">Deterministic Replay</text><text id="card_deterministic_replay_engineSummary" data-edit-id="summary" data-edit-label="Card summary" x="40" y="132" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13.5" fill="#cbd5e1">Time-travel debugging with bit-exact event journal rec</text><path d="M40 166H360" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/><text id="card_deterministic_replay_engineBadge" data-edit-id="badge" data-edit-label="Card status badge" x="40" y="196" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#34d399">REPLAY · BIT-EXACT</text></g>
  <g id="card_deterministic_replay_engineVisual" data-edit-id="visual" data-edit-label="Animated card illustration"><rect x="410" y="42" width="194" height="156" rx="12" fill="#061216" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="507" cy="120" r="48" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="12 8"><animateTransform id="card_deterministic_replay_engineOrbitAnim" attributeName="transform" type="rotate" from="0 507 120" to="360 507 120" dur="6s" repeatCount="indefinite"/></circle><circle cx="507" cy="120" r="18" fill="#34d399"><animate attributeName="r" values="15;21;15" dur="4s" repeatCount="indefinite"/></circle></g>
