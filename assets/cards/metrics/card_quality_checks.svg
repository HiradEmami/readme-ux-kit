<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="card_quality_checksTitle card_quality_checksDesc">
  <title id="card_quality_checksTitle">Quality Checks</title>
  <desc id="card_quality_checksDesc">A README metrics section explaining quality checks. A calm signal indicates direction while all information remains visible.</desc>
  <g id="card_quality_checksBase" data-edit-id="base" data-edit-label="Card background" data-edit-lock="true"><rect width="640" height="240" rx="20" fill="#08111f"/><rect x="16" y="16" width="608" height="208" rx="16" fill="#111c2e" stroke="#a78bfa" stroke-width="2"/></g>
  <g id="card_quality_checksCopy" data-edit-id="copy" data-edit-label="Editable card copy"><text id="card_quality_checksEyebrow" data-edit-id="eyebrow" data-edit-label="Card category" x="40" y="54" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">METRICS · SAMPLE</text><text id="card_quality_checksLabel" data-edit-id="label" data-edit-label="Card title" x="40" y="100" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750" fill="#f8fafc">Quality Checks</text><text id="card_quality_checksSummary" data-edit-id="summary" data-edit-label="Card summary" x="40" y="135" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#cbd5e1">Editable summary for project-specific details.</text><path d="M40 172H330" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/><text x="40" y="201" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">ILLUSTRATIVE CONTENT</text></g>
  <g id="card_quality_checksVisual" data-edit-id="visual" data-edit-label="Card illustration"><path d="M420 72H574V184H420ZM444 96H550M444 122H526M444 148H538" fill="none" stroke="#a78bfa" stroke-width="3"/><circle cx="590" cy="38" r="7" fill="#a78bfa"><animate id="card_quality_checksPulseMotion" attributeName="opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>
