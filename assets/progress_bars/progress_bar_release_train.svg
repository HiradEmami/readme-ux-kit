<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 72" role="img" aria-labelledby="progress_bar_release_trainTitle progress_bar_release_trainDesc">
  <title id="progress_bar_release_trainTitle">Progress Bar Release Train</title>
  <desc id="progress_bar_release_trainDesc">A README release section explaining progress bar release train. Progress Bar Release Train as a unquantified stage path. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="progress_bar_release_trainBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="640" height="72" rx="18" fill="#08111f"/><g id="progress_bar_release_trainLabel" data-edit-id="label" data-edit-label="Progress label"><text x="22" y="29" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#22d3ee">ROADMAP SIGNAL</text><text x="22" y="49" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RELEASE TRAIN</text></g><g id="progress_bar_release_trainTrack" data-edit-id="track" data-edit-label="Editable progress stages"><rect x="205" y="27" width="63" height="18" rx="5" fill="#22d3ee"/><rect x="284" y="31" width="63" height="10" rx="5" fill="#22d3ee"/><rect x="363" y="27" width="63" height="18" rx="5" fill="#263b5b"/><rect x="442" y="31" width="63" height="10" rx="5" fill="#263b5b"/><rect x="521" y="27" width="63" height="18" rx="5" fill="#263b5b"/><path d="M205 55H584" stroke="#263b5b" stroke-width="2" stroke-dasharray="4 7"/></g><circle id="progress_bar_release_trainMarker" data-edit-id="motion" data-edit-label="Active marker" cx="360" cy="36" r="9" fill="#f8fafc"><animate id="progress_bar_release_trainMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
