<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 72" role="img" aria-labelledby="progress_bar_rollout_ringsTitle progress_bar_rollout_ringsDesc">
  <title id="progress_bar_rollout_ringsTitle">Progress Bar Rollout Rings</title>
  <desc id="progress_bar_rollout_ringsDesc">A README rollout section explaining progress bar rollout rings. Progress Bar Rollout Rings as a unquantified stage path. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="progress_bar_rollout_ringsBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="640" height="72" rx="18" fill="#08111f"/><g id="progress_bar_rollout_ringsLabel" data-edit-id="label" data-edit-label="Progress label"><text x="22" y="29" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#a78bfa">ROADMAP SIGNAL</text><text x="22" y="49" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="800" fill="#f8fafc">ROLLOUT RINGS</text></g><g id="progress_bar_rollout_ringsTrack" data-edit-id="track" data-edit-label="Editable progress stages"><rect x="205" y="27" width="63" height="18" rx="5" fill="#a78bfa"/><rect x="284" y="31" width="63" height="10" rx="5" fill="#a78bfa"/><rect x="363" y="27" width="63" height="18" rx="5" fill="#263b5b"/><rect x="442" y="31" width="63" height="10" rx="5" fill="#263b5b"/><rect x="521" y="27" width="63" height="18" rx="5" fill="#263b5b"/><path d="M205 55H584" stroke="#263b5b" stroke-width="2" stroke-dasharray="4 7"/></g><circle id="progress_bar_rollout_ringsMarker" data-edit-id="motion" data-edit-label="Active marker" cx="360" cy="36" r="9" fill="#f8fafc"><animate id="progress_bar_rollout_ringsMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
