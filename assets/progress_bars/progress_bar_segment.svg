<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 10" width="300" height="10" role="img" aria-labelledby="progress_bar_segment-title progress_bar_segment-desc">
  <title id="progress_bar_segment-title">Progress Bar Segment</title>
  <desc id="progress_bar_segment-desc">An animated README SVG asset illustrating Progress Bar Segment.</desc>
  <rect width="300" height="10" rx="5" fill="#111827"/>
  <rect x="0" width="40" height="10" fill="#22d3ee">
    <animate attributeName="x" values="0;260" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
