<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 10" width="300" height="10" role="img" aria-labelledby="progress_bar_indeterminate-title progress_bar_indeterminate-desc">
  <title id="progress_bar_indeterminate-title">Progress Bar Indeterminate</title>
  <desc id="progress_bar_indeterminate-desc">An animated README SVG asset illustrating Progress Bar Indeterminate.</desc>
  <rect width="300" height="10" rx="5" fill="#1f2937"/>
  <rect width="80" height="10" rx="5" fill="#22d3ee">
    <animate attributeName="x" values="-80;300" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
