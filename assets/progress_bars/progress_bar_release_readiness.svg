  </defs>
  <rect x="1" y="1" width="618" height="52" rx="12" fill="#07111f" stroke="#1e293b" stroke-width="2"/>
  <text x="22" y="34" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#e2e8f0">release readiness</text>
  <rect x="214" y="18" width="320" height="18" rx="9" fill="#111827"/>
