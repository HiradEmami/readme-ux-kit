<svg xmlns="http://www.w3.org/2000/svg" width="300" height="10" viewBox="0 0 300 10" role="img" aria-labelledby="progress_bar_classic-title progress_bar_classic-desc">
  <title id="progress_bar_classic-title">Progress Bar Classic</title>
  <desc id="progress_bar_classic-desc">An animated README SVG asset illustrating Progress Bar Classic.</desc>
  <rect width="300" height="10" rx="5" fill="#1f2937"/>
  <rect width="120" height="10" rx="5" fill="#22d3ee">
    <animate attributeName="width" values="60;240;60" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
