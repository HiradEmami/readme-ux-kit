<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="particle burst icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .icon-line { fill: none; stroke: url(#g); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: 90px 30px; }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    </style>
  </defs>
  <rect x="8" y="8" width="104" height="104" rx="24" fill="#070717"/>
  <g class="icon-line" filter="url(#glow)">
    <circle cx="60" cy="60" r="8"/><path d="M60 20v20M60 80v20M20 60h20M80 60h20M32 32l14 14M74 74l14 14M88 32L74 46M46 74L32 88"/>
  </g>
  <circle class="pulse" cx="90" cy="30" r="5" fill="url(#g)"/>
</svg>
