<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="icon_orbiting_satellites-title icon_orbiting_satellites-desc">
  <title id="icon_orbiting_satellites-title">Icon Orbiting Satellites</title>
  <desc id="icon_orbiting_satellites-desc">An animated README SVG asset illustrating Icon Orbiting Satellites.</desc>
  <circle cx="60" cy="60" r="5" fill="#22d3ee"/>
  <circle cx="60" cy="20" r="4" fill="#a855f7">
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="100" r="4" fill="#22d3ee">
    <animateTransform attributeName="transform" type="rotate"
      from="360 60 60" to="0 60 60" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
