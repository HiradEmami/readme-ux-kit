<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="icon_spinning_ring-title icon_spinning_ring-desc">
  <title id="icon_spinning_ring-title">Icon Spinning Ring</title>
  <desc id="icon_spinning_ring-desc">An animated README SVG asset illustrating Icon Spinning Ring.</desc>
