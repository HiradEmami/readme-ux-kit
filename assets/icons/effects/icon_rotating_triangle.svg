<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="icon_rotating_triangle-title icon_rotating_triangle-desc">
  <title id="icon_rotating_triangle-title">Icon Rotating Triangle</title>
  <desc id="icon_rotating_triangle-desc">An animated README SVG asset illustrating Icon Rotating Triangle.</desc>
<polygon points="40,15 65,65 15,65" fill="none" stroke="#22d3ee">
<animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="2s" repeatCount="indefinite"/>
</polygon>
</svg>
