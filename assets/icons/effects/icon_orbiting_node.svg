<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="icon_orbiting_node-title icon_orbiting_node-desc">
  <title id="icon_orbiting_node-title">Icon Orbiting Node</title>
  <desc id="icon_orbiting_node-desc">An animated README SVG asset illustrating Icon Orbiting Node.</desc>
  <circle cx="40" cy="40" r="3" fill="#94a3b8"/>
