<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="icon_signal_pulse-title icon_signal_pulse-desc">
  <title id="icon_signal_pulse-title">Icon Signal Pulse</title>
  <desc id="icon_signal_pulse-desc">An animated README SVG asset illustrating Icon Signal Pulse.</desc>
  <circle cx="40" cy="40" r="5" fill="#22d3ee"/>
  <circle cx="40" cy="40" r="5" fill="none" stroke="#22d3ee">
    <animate attributeName="r" values="5;30" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
