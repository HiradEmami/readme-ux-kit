<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" role="img" aria-labelledby="icon_notice-title icon_notice-desc">
  <title id="icon_notice-title">Icon Notice</title>
  <desc id="icon_notice-desc">An animated README SVG asset illustrating Icon Notice.</desc>
  <circle cx="30" cy="30" r="10" fill="#a855f7"/>

  <circle cx="30" cy="30" r="3" fill="white">
    <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
