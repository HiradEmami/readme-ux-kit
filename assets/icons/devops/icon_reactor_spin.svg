<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="icon_reactor_spin-title icon_reactor_spin-desc">
  <title id="icon_reactor_spin-title">Icon Reactor Spin</title>
  <desc id="icon_reactor_spin-desc">An animated README SVG asset illustrating Icon Reactor Spin.</desc>
  <circle cx="60" cy="60" r="8" fill="#22d3ee"/>
  <g stroke="#a855f7">
    <line x1="60" y1="10" x2="60" y2="40"/>
    <line x1="60" y1="80" x2="60" y2="110"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="1.5s" repeatCount="indefinite"/>
  </g>
</svg>
