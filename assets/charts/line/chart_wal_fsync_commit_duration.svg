<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_wal_fsync_commit_durationTitle chart_wal_fsync_commit_durationDesc">
  <title id="chart_wal_fsync_commit_durationTitle">WAL Fsync Commit Latency</title>
  <desc id="chart_wal_fsync_commit_durationDesc">Animated README line chart for WAL Fsync Commit Latency. Illustrative sample values (40, 55, 49, 74, 66, 88) with a four-second focus loop.</desc>
  <g id="chart_wal_fsync_commit_durationBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#0e0b06"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#1e170d" stroke="#f59e0b" stroke-width="2"/></g>
  <g id="chart_wal_fsync_commit_durationHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_wal_fsync_commit_durationLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">WAL Fsync Commit Latency</text><text id="chart_wal_fsync_commit_durationTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fbbf24">ILLUSTRATIVE DATA · LINE</text></g>
  <g id="chart_wal_fsync_commit_durationPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,262.0 226,229.0 342,242.2 458,187.2 574,204.8 690,156.4 690,355" fill="#f59e0b" opacity="0.22"/><polyline points="110,262.0 226,229.0 342,242.2 458,187.2 574,204.8 690,156.4" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_wal_fsync_commit_durationLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="156.4" r="9" fill="#fbbf24"><animate id="chart_wal_fsync_commit_durationPeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
