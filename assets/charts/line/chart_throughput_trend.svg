<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_throughput_trendTitle chart_throughput_trendDesc">
  <title id="chart_throughput_trendTitle">Throughput Trend</title>
