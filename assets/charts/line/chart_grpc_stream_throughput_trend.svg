<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_grpc_stream_throughput_trendTitle chart_grpc_stream_throughput_trendDesc">
  <title id="chart_grpc_stream_throughput_trendTitle">gRPC Stream Throughput Trend</title>
  <desc id="chart_grpc_stream_throughput_trendDesc">Animated README line chart for gRPC Stream Throughput Trend. Illustrative sample values (46, 64, 58, 82, 75, 93) with a four-second focus loop.</desc>
  <g id="chart_grpc_stream_throughput_trendBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#07101e"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0f1d33" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="chart_grpc_stream_throughput_trendHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_grpc_stream_throughput_trendLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">gRPC Stream Throughput Trend</text><text id="chart_grpc_stream_throughput_trendTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">ILLUSTRATIVE DATA · LINE</text></g>
  <g id="chart_grpc_stream_throughput_trendPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,248.8 226,209.2 342,222.4 458,169.6 574,185.0 690,145.4 690,355" fill="#38bdf8" opacity="0.22"/><polyline points="110,248.8 226,209.2 342,222.4 458,169.6 574,185.0 690,145.4" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_grpc_stream_throughput_trendLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="145.4" r="9" fill="#7dd3fc"><animate id="chart_grpc_stream_throughput_trendPeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
