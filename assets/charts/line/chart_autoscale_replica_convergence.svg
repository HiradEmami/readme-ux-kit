<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_autoscale_replica_convergenceTitle chart_autoscale_replica_convergenceDesc">
  <title id="chart_autoscale_replica_convergenceTitle">Autoscale Replica Convergence</title>
  <desc id="chart_autoscale_replica_convergenceDesc">Animated README line chart for Autoscale Replica Convergence. Illustrative sample values (38, 62, 77, 71, 89, 94) with a four-second focus loop.</desc>
  <g id="chart_autoscale_replica_convergenceBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#06120b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0e2417" stroke="#34d399" stroke-width="2"/></g>
  <g id="chart_autoscale_replica_convergenceHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_autoscale_replica_convergenceLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Autoscale Replica Convergence</text><text id="chart_autoscale_replica_convergenceTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">ILLUSTRATIVE DATA · LINE</text></g>
  <g id="chart_autoscale_replica_convergencePlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,266.4 226,213.6 342,180.6 458,193.8 574,154.2 690,143.2 690,355" fill="#34d399" opacity="0.22"/><polyline points="110,266.4 226,213.6 342,180.6 458,193.8 574,154.2 690,143.2" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_autoscale_replica_convergenceLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="143.2" r="9" fill="#6ee7b7"><animate id="chart_autoscale_replica_convergencePeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
