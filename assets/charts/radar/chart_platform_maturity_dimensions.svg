<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_platform_maturity_dimensionsTitle chart_platform_maturity_dimensionsDesc">
  <title id="chart_platform_maturity_dimensionsTitle">Platform Maturity Radar</title>
  <desc id="chart_platform_maturity_dimensionsDesc">Animated README radar chart for Platform Maturity Radar. Illustrative sample values (88, 82, 91, 76, 85, 90) with a four-second focus loop.</desc>
  <g id="chart_platform_maturity_dimensionsBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#070c1b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111936" stroke="#60a5fa" stroke-width="2"/></g>
  <g id="chart_platform_maturity_dimensionsHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_platform_maturity_dimensionsLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Platform Maturity Radar</text><text id="chart_platform_maturity_dimensionsTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">ILLUSTRATIVE DATA · RADAR</text></g>
  <g id="chart_platform_maturity_dimensionsPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><polygon points="400,115 515,175 515,295 400,355 285,295 285,175" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/><polygon points="400,135 495,185 480,282 400,332 308,280 312,182" fill="#60a5fa" fill-opacity="0.28" stroke="#60a5fa" stroke-width="3"/><circle cx="400" cy="135" r="8" fill="#93c5fd"><animate id="chart_platform_maturity_dimensionsRadarPulse" attributeName="r" values="5;11;5" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_platform_maturity_dimensionsLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#60a5fa"/><text id="chart_platform_maturity_dimensionsLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (88, 82, 91, 76, 85, 90) are illustrative</text></g>
</svg>
