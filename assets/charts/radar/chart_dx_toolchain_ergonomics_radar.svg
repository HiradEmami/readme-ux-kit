<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_dx_toolchain_ergonomics_radarTitle chart_dx_toolchain_ergonomics_radarDesc">
  <title id="chart_dx_toolchain_ergonomics_radarTitle">DX Toolchain Ergonomics</title>
  <desc id="chart_dx_toolchain_ergonomics_radarDesc">Animated README radar chart for DX Toolchain Ergonomics. Illustrative sample values (86, 80, 93, 85, 78, 91) with a four-second focus loop.</desc>
  <g id="chart_dx_toolchain_ergonomics_radarBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#0a091a"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#151332" stroke="#a78bfa" stroke-width="2"/></g>
  <g id="chart_dx_toolchain_ergonomics_radarHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_dx_toolchain_ergonomics_radarLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">DX Toolchain Ergonomics</text><text id="chart_dx_toolchain_ergonomics_radarTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">ILLUSTRATIVE DATA · RADAR</text></g>
  <g id="chart_dx_toolchain_ergonomics_radarPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><polygon points="400,115 515,175 515,295 400,355 285,295 285,175" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/><polygon points="400,135 495,185 480,282 400,332 308,280 312,182" fill="#a78bfa" fill-opacity="0.28" stroke="#a78bfa" stroke-width="3"/><circle cx="400" cy="135" r="8" fill="#c4b5fd"><animate id="chart_dx_toolchain_ergonomics_radarRadarPulse" attributeName="r" values="5;11;5" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_dx_toolchain_ergonomics_radarLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#a78bfa"/><text id="chart_dx_toolchain_ergonomics_radarLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (86, 80, 93, 85, 78, 91) are illustrative</text></g>
</svg>
