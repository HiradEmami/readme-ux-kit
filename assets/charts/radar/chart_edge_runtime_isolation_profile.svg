<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_edge_runtime_isolation_profileTitle chart_edge_runtime_isolation_profileDesc">
  <title id="chart_edge_runtime_isolation_profileTitle">Edge Runtime Isolation</title>
  <desc id="chart_edge_runtime_isolation_profileDesc">Animated README radar chart for Edge Runtime Isolation. Illustrative sample values (94, 87, 82, 90, 85, 89) with a four-second focus loop.</desc>
  <g id="chart_edge_runtime_isolation_profileBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#0e0b06"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#1e170d" stroke="#f59e0b" stroke-width="2"/></g>
  <g id="chart_edge_runtime_isolation_profileHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_edge_runtime_isolation_profileLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Edge Runtime Isolation</text><text id="chart_edge_runtime_isolation_profileTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fbbf24">ILLUSTRATIVE DATA · RADAR</text></g>
  <g id="chart_edge_runtime_isolation_profilePlot" data-edit-id="plot" data-edit-label="Animated chart plot"><polygon points="400,115 515,175 515,295 400,355 285,295 285,175" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/><polygon points="400,135 495,185 480,282 400,332 308,280 312,182" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-width="3"/><circle cx="400" cy="135" r="8" fill="#fbbf24"><animate id="chart_edge_runtime_isolation_profileRadarPulse" attributeName="r" values="5;11;5" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_edge_runtime_isolation_profileLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#f59e0b"/><text id="chart_edge_runtime_isolation_profileLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (94, 87, 82, 90, 85, 89) are illustrative</text></g>
</svg>
