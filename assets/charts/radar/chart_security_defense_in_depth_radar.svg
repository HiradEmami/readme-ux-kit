<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_security_defense_in_depth_radarTitle chart_security_defense_in_depth_radarDesc">
  <title id="chart_security_defense_in_depth_radarTitle">Defense-in-Depth Posture</title>
  <desc id="chart_security_defense_in_depth_radarDesc">Animated README radar chart for Defense-in-Depth Posture. Illustrative sample values (90, 85, 88, 79, 92, 87) with a four-second focus loop.</desc>
  <g id="chart_security_defense_in_depth_radarBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#07101e"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0f1d33" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="chart_security_defense_in_depth_radarHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_security_defense_in_depth_radarLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Defense-in-Depth Posture</text><text id="chart_security_defense_in_depth_radarTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">ILLUSTRATIVE DATA · RADAR</text></g>
  <g id="chart_security_defense_in_depth_radarPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><polygon points="400,115 515,175 515,295 400,355 285,295 285,175" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/><polygon points="400,135 495,185 480,282 400,332 308,280 312,182" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="3"/><circle cx="400" cy="135" r="8" fill="#7dd3fc"><animate id="chart_security_defense_in_depth_radarRadarPulse" attributeName="r" values="5;11;5" dur="4s" repeatCount="indefinite"/></circle></g>
