<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_model_eval_capability_axesTitle chart_model_eval_capability_axesDesc">
  <title id="chart_model_eval_capability_axesTitle">LLM Evaluation Capability</title>
  <desc id="chart_model_eval_capability_axesDesc">Animated README radar chart for LLM Evaluation Capability. Illustrative sample values (92, 78, 86, 84, 79, 94) with a four-second focus loop.</desc>
  <g id="chart_model_eval_capability_axesBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#050f19"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="chart_model_eval_capability_axesHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_model_eval_capability_axesLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">LLM Evaluation Capability</text><text id="chart_model_eval_capability_axesTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#67e8f9">ILLUSTRATIVE DATA · RADAR</text></g>
  <g id="chart_model_eval_capability_axesPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><polygon points="400,115 515,175 515,295 400,355 285,295 285,175" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4"/><polygon points="400,135 495,185 480,282 400,332 308,280 312,182" fill="#22d3ee" fill-opacity="0.28" stroke="#22d3ee" stroke-width="3"/><circle cx="400" cy="135" r="8" fill="#67e8f9"><animate id="chart_model_eval_capability_axesRadarPulse" attributeName="r" values="5;11;5" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_model_eval_capability_axesLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#22d3ee"/><text id="chart_model_eval_capability_axesLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (92, 78, 86, 84, 79, 94) are illustrative</text></g>
</svg>
