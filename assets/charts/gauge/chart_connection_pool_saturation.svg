<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_connection_pool_saturationTitle chart_connection_pool_saturationDesc">
  <title id="chart_connection_pool_saturationTitle">Connection Pool Saturation</title>
  <desc id="chart_connection_pool_saturationDesc">Animated README gauge chart for Connection Pool Saturation. Illustrative sample values (82) with a four-second focus loop.</desc>
  <g id="chart_connection_pool_saturationBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#070c1b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111936" stroke="#60a5fa" stroke-width="2"/></g>
  <g id="chart_connection_pool_saturationHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_connection_pool_saturationLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Connection Pool Saturation</text><text id="chart_connection_pool_saturationTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">ILLUSTRATIVE DATA · GAUGE</text></g>
  <g id="chart_connection_pool_saturationPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M240 320A160 160 0 0 1 560 320" fill="none" stroke="#070c1b" stroke-width="28" stroke-linecap="round"/><path d="M240 320A160 160 0 0 1 520 210" fill="none" stroke="#60a5fa" stroke-width="24" stroke-linecap="round" stroke-dasharray="16 8"><animate id="chart_connection_pool_saturationGaugeArc" attributeName="stroke-dashoffset" values="48;0" dur="4s" repeatCount="indefinite"/></path><circle cx="400" cy="320" r="14" fill="#93c5fd"/><text id="chart_connection_pool_saturationGaugeValue" data-edit-id="gauge-value" data-edit-label="Gauge readout" x="400" y="275" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#f8fafc">82%</text></g>
  <g id="chart_connection_pool_saturationLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#60a5fa"/><text id="chart_connection_pool_saturationLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (82) are illustrative</text></g>
