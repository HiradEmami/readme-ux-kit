<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_nvlink_fabric_bandwidth_dialTitle chart_nvlink_fabric_bandwidth_dialDesc">
  <title id="chart_nvlink_fabric_bandwidth_dialTitle">NVLink Fabric Utilization</title>
  <desc id="chart_nvlink_fabric_bandwidth_dialDesc">Animated README gauge chart for NVLink Fabric Utilization. Illustrative sample values (91) with a four-second focus loop.</desc>
  <g id="chart_nvlink_fabric_bandwidth_dialBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#07101e"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0f1d33" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="chart_nvlink_fabric_bandwidth_dialHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_nvlink_fabric_bandwidth_dialLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">NVLink Fabric Utilization</text><text id="chart_nvlink_fabric_bandwidth_dialTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">ILLUSTRATIVE DATA · GAUGE</text></g>
  <g id="chart_nvlink_fabric_bandwidth_dialPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M240 320A160 160 0 0 1 560 320" fill="none" stroke="#07101e" stroke-width="28" stroke-linecap="round"/><path d="M240 320A160 160 0 0 1 520 210" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-dasharray="16 8"><animate id="chart_nvlink_fabric_bandwidth_dialGaugeArc" attributeName="stroke-dashoffset" values="48;0" dur="4s" repeatCount="indefinite"/></path><circle cx="400" cy="320" r="14" fill="#7dd3fc"/><text id="chart_nvlink_fabric_bandwidth_dialGaugeValue" data-edit-id="gauge-value" data-edit-label="Gauge readout" x="400" y="275" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#f8fafc">91%</text></g>
