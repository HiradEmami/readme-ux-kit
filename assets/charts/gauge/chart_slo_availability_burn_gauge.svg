<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_slo_availability_burn_gaugeTitle chart_slo_availability_burn_gaugeDesc">
  <title id="chart_slo_availability_burn_gaugeTitle">SLO Availability Reserve</title>
  <desc id="chart_slo_availability_burn_gaugeDesc">Animated README gauge chart for SLO Availability Reserve. Illustrative sample values (94) with a four-second focus loop.</desc>
  <g id="chart_slo_availability_burn_gaugeBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#11070d"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#23101a" stroke="#fb7185" stroke-width="2"/></g>
  <g id="chart_slo_availability_burn_gaugeHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_slo_availability_burn_gaugeLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">SLO Availability Reserve</text><text id="chart_slo_availability_burn_gaugeTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fda4af">ILLUSTRATIVE DATA · GAUGE</text></g>
  <g id="chart_slo_availability_burn_gaugePlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M240 320A160 160 0 0 1 560 320" fill="none" stroke="#11070d" stroke-width="28" stroke-linecap="round"/><path d="M240 320A160 160 0 0 1 520 210" fill="none" stroke="#fb7185" stroke-width="24" stroke-linecap="round" stroke-dasharray="16 8"><animate id="chart_slo_availability_burn_gaugeGaugeArc" attributeName="stroke-dashoffset" values="48;0" dur="4s" repeatCount="indefinite"/></path><circle cx="400" cy="320" r="14" fill="#fda4af"/><text id="chart_slo_availability_burn_gaugeGaugeValue" data-edit-id="gauge-value" data-edit-label="Gauge readout" x="400" y="275" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#f8fafc">94%</text></g>
  <g id="chart_slo_availability_burn_gaugeLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#fb7185"/><text id="chart_slo_availability_burn_gaugeLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (94) are illustrative</text></g>
</svg>
