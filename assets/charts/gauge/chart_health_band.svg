<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_health_bandTitle chart_health_bandDesc">
  <title id="chart_health_bandTitle">Health Band</title>
  <desc id="chart_health_bandDesc">A README gauge section explaining health band. Illustrative sample values are 45, 74, 63, 84, 69, 77 and do not represent live project metrics. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
<g id="chart_health_bandBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect width="800" height="450" rx="18" fill="#08111f"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111c2e" stroke="#60a5fa" stroke-width="2"/></g><text id="chart_health_bandLabel" data-edit-id="label" data-edit-label="Chart title" x="55" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">Health Band</text><text x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">ILLUSTRATIVE DATA</text><g id="chart_health_bandPlot" data-edit-id="plot" data-edit-label="Illustrative chart marks"><path d="M270 285A130 130 0 0 1 530 285" fill="none" stroke="#60a5fa" stroke-width="36" opacity=".3"/><path d="M270 285A130 130 0 0 1 512.1 259.1" fill="none" stroke="#60a5fa" stroke-width="36"/><circle cx="400" cy="285" r="15" fill="#60a5fa"/><path d="M400 285 480 205" stroke="#f8fafc" stroke-width="5"/><text x="400" y="350" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#cbd5e1">SAMPLE BAND</text><circle cx="724" cy="96" r="8" fill="#60a5fa"><animate id="chart_health_bandFocusMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle></g><g id="chart_health_bandLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="398" width="14" height="14" rx="3" fill="#60a5fa"/><text x="78" y="410" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values are illustrative</text></g>
</svg>
