<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_dlq_quarantine_thresholdTitle chart_dlq_quarantine_thresholdDesc">
  <title id="chart_dlq_quarantine_thresholdTitle">DLQ Quarantine Threshold</title>
  <desc id="chart_dlq_quarantine_thresholdDesc">Animated README gauge chart for DLQ Quarantine Threshold. Illustrative sample values (68) with a four-second focus loop.</desc>
  <g id="chart_dlq_quarantine_thresholdBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#050f19"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="chart_dlq_quarantine_thresholdHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_dlq_quarantine_thresholdLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">DLQ Quarantine Threshold</text><text id="chart_dlq_quarantine_thresholdTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#67e8f9">ILLUSTRATIVE DATA · GAUGE</text></g>
  <g id="chart_dlq_quarantine_thresholdPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M240 320A160 160 0 0 1 560 320" fill="none" stroke="#050f19" stroke-width="28" stroke-linecap="round"/><path d="M240 320A160 160 0 0 1 520 210" fill="none" stroke="#22d3ee" stroke-width="24" stroke-linecap="round" stroke-dasharray="16 8"><animate id="chart_dlq_quarantine_thresholdGaugeArc" attributeName="stroke-dashoffset" values="48;0" dur="4s" repeatCount="indefinite"/></path><circle cx="400" cy="320" r="14" fill="#67e8f9"/><text id="chart_dlq_quarantine_thresholdGaugeValue" data-edit-id="gauge-value" data-edit-label="Gauge readout" x="400" y="275" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#f8fafc">68%</text></g>
  <g id="chart_dlq_quarantine_thresholdLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#22d3ee"/><text id="chart_dlq_quarantine_thresholdLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (68) are illustrative</text></g>
</svg>
