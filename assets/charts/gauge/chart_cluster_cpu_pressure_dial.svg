<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_cluster_cpu_pressure_dialTitle chart_cluster_cpu_pressure_dialDesc">
  <title id="chart_cluster_cpu_pressure_dialTitle">Cluster CPU Pressure Dial</title>
  <desc id="chart_cluster_cpu_pressure_dialDesc">Animated README gauge chart for Cluster CPU Pressure Dial. Illustrative sample values (78) with a four-second focus loop.</desc>
  <g id="chart_cluster_cpu_pressure_dialBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#06120b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0e2417" stroke="#34d399" stroke-width="2"/></g>
  <g id="chart_cluster_cpu_pressure_dialHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_cluster_cpu_pressure_dialLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Cluster CPU Pressure Dial</text><text id="chart_cluster_cpu_pressure_dialTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">ILLUSTRATIVE DATA · GAUGE</text></g>
  <g id="chart_cluster_cpu_pressure_dialPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M240 320A160 160 0 0 1 560 320" fill="none" stroke="#06120b" stroke-width="28" stroke-linecap="round"/><path d="M240 320A160 160 0 0 1 520 210" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" stroke-dasharray="16 8"><animate id="chart_cluster_cpu_pressure_dialGaugeArc" attributeName="stroke-dashoffset" values="48;0" dur="4s" repeatCount="indefinite"/></path><circle cx="400" cy="320" r="14" fill="#6ee7b7"/><text id="chart_cluster_cpu_pressure_dialGaugeValue" data-edit-id="gauge-value" data-edit-label="Gauge readout" x="400" y="275" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#f8fafc">78%</text></g>
  <g id="chart_cluster_cpu_pressure_dialLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#34d399"/><text id="chart_cluster_cpu_pressure_dialLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (78) are illustrative</text></g>
</svg>
