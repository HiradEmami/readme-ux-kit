<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_serverless_concurrency_waveTitle chart_serverless_concurrency_waveDesc">
  <title id="chart_serverless_concurrency_waveTitle">Serverless Concurrency Wave</title>
  <desc id="chart_serverless_concurrency_waveDesc">Animated README area chart for Serverless Concurrency Wave. Illustrative sample values (44, 79, 62, 90, 74, 96) with a four-second focus loop.</desc>
  <g id="chart_serverless_concurrency_waveBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#06120b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0e2417" stroke="#34d399" stroke-width="2"/></g>
  <g id="chart_serverless_concurrency_waveHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_serverless_concurrency_waveLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Serverless Concurrency Wave</text><text id="chart_serverless_concurrency_waveTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">ILLUSTRATIVE DATA · AREA</text></g>
  <g id="chart_serverless_concurrency_wavePlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,253.2 226,176.2 342,213.6 458,152.0 574,187.2 690,138.8 690,355" fill="#34d399" opacity="0.22"/><polyline points="110,253.2 226,176.2 342,213.6 458,152.0 574,187.2 690,138.8" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_serverless_concurrency_waveLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="138.8" r="9" fill="#6ee7b7"><animate id="chart_serverless_concurrency_wavePeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_serverless_concurrency_waveLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#34d399"/><text id="chart_serverless_concurrency_waveLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (44, 79, 62, 90, 74, 96) are illustrative</text></g>
