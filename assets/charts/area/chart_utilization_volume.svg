<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_utilization_volumeTitle chart_utilization_volumeDesc">
  <title id="chart_utilization_volumeTitle">Utilization Volume</title>
  <desc id="chart_utilization_volumeDesc">A README area section explaining utilization volume. Illustrative sample values are 53, 85, 68, 93, 73, 85 and do not represent live project metrics. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
<g id="chart_utilization_volumeBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect width="800" height="450" rx="18" fill="#08111f"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111c2e" stroke="#34d399" stroke-width="2"/></g><text id="chart_utilization_volumeLabel" data-edit-id="label" data-edit-label="Chart title" x="55" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">Utilization Volume</text><text x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">ILLUSTRATIVE DATA</text><g id="chart_utilization_volumePlot" data-edit-id="plot" data-edit-label="Illustrative chart marks"><path d="M90 360H730M90 110V360" stroke="#cbd5e1" stroke-width="2"/><polygon points="105,360 105,217.2 225,134 345,178.2 465,113.19999999999999 585,165.2 705,134 705,360" fill="#34d399" opacity=".25"/><polyline points="105,217.2 225,134 345,178.2 465,113.19999999999999 585,165.2 705,134" fill="none" stroke="#34d399" stroke-width="5"/><circle cx="724" cy="96" r="8" fill="#34d399"><animate id="chart_utilization_volumeFocusMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle></g><g id="chart_utilization_volumeLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="398" width="14" height="14" rx="3" fill="#34d399"/><text x="78" y="410" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values are illustrative</text></g>
</svg>
