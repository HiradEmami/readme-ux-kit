<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_edge_request_absorptionTitle chart_edge_request_absorptionDesc">
  <title id="chart_edge_request_absorptionTitle">Edge Request Absorption</title>
  <desc id="chart_edge_request_absorptionDesc">Animated README area chart for Edge Request Absorption. Illustrative sample values (42, 68, 61, 84, 79, 95) with a four-second focus loop.</desc>
  <g id="chart_edge_request_absorptionBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#07101e"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0f1d33" stroke="#38bdf8" stroke-width="2"/></g>
  <g id="chart_edge_request_absorptionHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_edge_request_absorptionLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Edge Request Absorption</text><text id="chart_edge_request_absorptionTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">ILLUSTRATIVE DATA · AREA</text></g>
  <g id="chart_edge_request_absorptionPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,257.6 226,200.4 342,215.8 458,165.2 574,176.2 690,141.0 690,355" fill="#38bdf8" opacity="0.22"/><polyline points="110,257.6 226,200.4 342,215.8 458,165.2 574,176.2 690,141.0" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_edge_request_absorptionLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="141.0" r="9" fill="#7dd3fc"><animate id="chart_edge_request_absorptionPeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="chart_edge_request_absorptionLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#38bdf8"/><text id="chart_edge_request_absorptionLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (42, 68, 61, 84, 79, 95) are illustrative</text></g>
</svg>
