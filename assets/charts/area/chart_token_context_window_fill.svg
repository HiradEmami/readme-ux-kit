<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_token_context_window_fillTitle chart_token_context_window_fillDesc">
  <title id="chart_token_context_window_fillTitle">Context Window Saturation</title>
  <desc id="chart_token_context_window_fillDesc">Animated README area chart for Context Window Saturation. Illustrative sample values (30, 52, 69, 77, 86, 93) with a four-second focus loop.</desc>
