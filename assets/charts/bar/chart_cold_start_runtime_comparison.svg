<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_cold_start_runtime_comparisonTitle chart_cold_start_runtime_comparisonDesc">
  <title id="chart_cold_start_runtime_comparisonTitle">Cold-Start Runtime Benchmark</title>
  <desc id="chart_cold_start_runtime_comparisonDesc">Animated README bar chart for Cold-Start Runtime Benchmark. Illustrative sample values (88, 74, 95, 62, 79, 84) with a four-second focus loop.</desc>
