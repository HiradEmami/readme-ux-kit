  <g id="chart_cold_start_runtime_comparisonHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_cold_start_runtime_comparisonLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Cold-Start Runtime Benchmark</text><text id="chart_cold_start_runtime_comparisonTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">ILLUSTRATIVE DATA · BAR</text></g>
