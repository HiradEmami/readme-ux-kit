<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_compiler_pass_duration_barsTitle chart_compiler_pass_duration_barsDesc">
  <title id="chart_compiler_pass_duration_barsTitle">Compiler Pass Durations</title>
  <desc id="chart_compiler_pass_duration_barsDesc">Animated README bar chart for Compiler Pass Durations. Illustrative sample values (64, 82, 49, 91, 58, 76) with a four-second focus loop.</desc>
  <g id="chart_compiler_pass_duration_barsBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#050f19"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="chart_compiler_pass_duration_barsHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_compiler_pass_duration_barsLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Compiler Pass Durations</text><text id="chart_compiler_pass_duration_barsTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#67e8f9">ILLUSTRATIVE DATA · BAR</text></g>
  <g id="chart_compiler_pass_duration_barsPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><g fill="#22d3ee"><rect x="125" y="214.2" width="54" height="140.8" rx="6"/><rect x="220" y="174.6" width="54" height="180.4" rx="6"/><rect x="315" y="247.2" width="54" height="107.8" rx="6"><animate id="chart_compiler_pass_duration_barsBarPulse" attributeName="opacity" values="1;0.45;1" dur="4s" repeatCount="indefinite"/></rect><rect x="410" y="154.8" width="54" height="200.2" rx="6"/><rect x="505" y="227.4" width="54" height="127.6" rx="6"/><rect x="600" y="187.8" width="54" height="167.2" rx="6"/></g><path d="M95 165H715" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="10 8"><animate id="chart_compiler_pass_duration_barsTargetAnim" attributeName="stroke-dashoffset" values="36;0" dur="4s" repeatCount="indefinite"/></path></g>
  <g id="chart_compiler_pass_duration_barsLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#22d3ee"/><text id="chart_compiler_pass_duration_barsLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (64, 82, 49, 91, 58, 76) are illustrative</text></g>
</svg>
