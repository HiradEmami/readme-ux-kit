<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_latency_pulseTitle chart_latency_pulseDesc">
  <title id="chart_latency_pulseTitle">Latency Pulse</title>
  <desc id="chart_latency_pulseDesc">A README sparkline section explaining latency pulse. Illustrative sample values are 61, 82, 73, 10, 75, 93 and do not represent live project metrics. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
<g id="chart_latency_pulseBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect width="800" height="450" rx="18" fill="#08111f"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111c2e" stroke="#a78bfa" stroke-width="2"/></g><text id="chart_latency_pulseLabel" data-edit-id="label" data-edit-label="Chart title" x="55" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">Latency Pulse</text><text x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">ILLUSTRATIVE DATA</text><g id="chart_latency_pulsePlot" data-edit-id="plot" data-edit-label="Illustrative chart marks"><path d="M90 360H730M90 110V360" stroke="#cbd5e1" stroke-width="2"/><polyline points="105,196.4 225,141.79999999999998 345,165.2 465,329 585,160 705,113.19999999999999" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linejoin="round"/><circle cx="105" cy="196.4" r="7" fill="#a78bfa"/><circle cx="225" cy="141.79999999999998" r="7" fill="#a78bfa"/><circle cx="345" cy="165.2" r="7" fill="#a78bfa"/><circle cx="465" cy="329" r="7" fill="#a78bfa"/><circle cx="585" cy="160" r="7" fill="#a78bfa"/><circle cx="705" cy="113.19999999999999" r="7" fill="#a78bfa"/><circle cx="724" cy="96" r="8" fill="#a78bfa"><animate id="chart_latency_pulseFocusMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle></g><g id="chart_latency_pulseLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="398" width="14" height="14" rx="3" fill="#a78bfa"/><text x="78" y="410" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values are illustrative</text></g>
