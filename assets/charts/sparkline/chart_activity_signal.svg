<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_activity_signalTitle chart_activity_signalDesc">
  <title id="chart_activity_signalTitle">Activity Signal</title>
  <desc id="chart_activity_signalDesc">A README sparkline section explaining activity signal. Illustrative sample values are 46, 68, 60, 89, 65, 78 and do not represent live project metrics. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
