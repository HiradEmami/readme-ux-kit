<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_live_ingress_rps_sparklineTitle chart_live_ingress_rps_sparklineDesc">
  <title id="chart_live_ingress_rps_sparklineTitle">Live Ingress RPS Pulse</title>
  <desc id="chart_live_ingress_rps_sparklineDesc">Animated README sparkline chart for Live Ingress RPS Pulse. Illustrative sample values (45, 62, 58, 84, 76, 95) with a four-second focus loop.</desc>
  <g id="chart_live_ingress_rps_sparklineBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#11070d"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#23101a" stroke="#fb7185" stroke-width="2"/></g>
  <g id="chart_live_ingress_rps_sparklineHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_live_ingress_rps_sparklineLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Live Ingress RPS Pulse</text><text id="chart_live_ingress_rps_sparklineTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fda4af">ILLUSTRATIVE DATA · SPARKLINE</text></g>
  <g id="chart_live_ingress_rps_sparklinePlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,251.0 226,213.6 342,222.4 458,165.2 574,182.8 690,141.0 690,355" fill="#fb7185" opacity="0.22"/><polyline points="110,251.0 226,213.6 342,222.4 458,165.2 574,182.8 690,141.0" fill="none" stroke="#fb7185" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_live_ingress_rps_sparklineLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="141.0" r="9" fill="#fda4af"><animate id="chart_live_ingress_rps_sparklinePeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
