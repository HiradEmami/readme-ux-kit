<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_raft_heartbeat_jitter_stripTitle chart_raft_heartbeat_jitter_stripDesc">
  <title id="chart_raft_heartbeat_jitter_stripTitle">Raft Heartbeat Jitter Strip</title>
  <desc id="chart_raft_heartbeat_jitter_stripDesc">Animated README sparkline chart for Raft Heartbeat Jitter Strip. Illustrative sample values (42, 48, 45, 52, 47, 50) with a four-second focus loop.</desc>
  <g id="chart_raft_heartbeat_jitter_stripBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#061216"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c2229" stroke="#2dd4bf" stroke-width="2"/></g>
  <g id="chart_raft_heartbeat_jitter_stripHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_raft_heartbeat_jitter_stripLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Raft Heartbeat Jitter Strip</text><text id="chart_raft_heartbeat_jitter_stripTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">ILLUSTRATIVE DATA · SPARKLINE</text></g>
  <g id="chart_raft_heartbeat_jitter_stripPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><path d="M90 355H725M90 105V355" stroke="#cbd5e1" stroke-width="2"/><polygon points="110,355 110,257.6 226,244.4 342,251.0 458,235.6 574,246.6 690,240.0 690,355" fill="#2dd4bf" opacity="0.22"/><polyline points="110,257.6 226,244.4 342,251.0 458,235.6 574,246.6 690,240.0" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 10"><animate id="chart_raft_heartbeat_jitter_stripLineAnim" attributeName="stroke-dashoffset" values="56;0" dur="4s" repeatCount="indefinite"/></polyline><circle cx="690" cy="240.0" r="9" fill="#6ee7b7"><animate id="chart_raft_heartbeat_jitter_stripPeakAnim" attributeName="r" values="6;12;6" dur="4s" repeatCount="indefinite"/></circle></g>
