<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_compute_cost_attribution_ringTitle chart_compute_cost_attribution_ringDesc">
  <title id="chart_compute_cost_attribution_ringTitle">Compute Cost Attribution</title>
  <desc id="chart_compute_cost_attribution_ringDesc">Animated README donut chart for Compute Cost Attribution. Illustrative sample values (42, 28, 18, 12) with a four-second focus loop.</desc>
  <g id="chart_compute_cost_attribution_ringBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#070c1b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111936" stroke="#60a5fa" stroke-width="2"/></g>
  <g id="chart_compute_cost_attribution_ringHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_compute_cost_attribution_ringLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Compute Cost Attribution</text><text id="chart_compute_cost_attribution_ringTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">ILLUSTRATIVE DATA · DONUT</text></g>
  <g id="chart_compute_cost_attribution_ringPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><circle cx="400" cy="235" r="96" fill="none" stroke="#070c1b" stroke-width="28"/><circle cx="400" cy="235" r="96" fill="none" stroke="#a78bfa" stroke-width="26" stroke-dasharray="420 600"/><circle cx="400" cy="235" r="96" fill="none" stroke="#60a5fa" stroke-width="26" stroke-linecap="round" stroke-dasharray="240 600"><animateTransform id="chart_compute_cost_attribution_ringDonutSpin" attributeName="transform" type="rotate" from="0 400 235" to="360 400 235" dur="8s" repeatCount="indefinite"/></circle><text id="chart_compute_cost_attribution_ringDonutMetric" data-edit-id="donut-metric" data-edit-label="Center metric" x="400" y="244" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">42%</text></g>
  <g id="chart_compute_cost_attribution_ringLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#60a5fa"/><text id="chart_compute_cost_attribution_ringLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (42, 28, 18, 12) are illustrative</text></g>
</svg>
