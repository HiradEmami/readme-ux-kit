  <g id="chart_storage_tier_hot_warm_coldPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><circle cx="400" cy="235" r="96" fill="none" stroke="#07101e" stroke-width="28"/><circle cx="400" cy="235" r="96" fill="none" stroke="#22d3ee" stroke-width="26" stroke-dasharray="420 600"/><circle cx="400" cy="235" r="96" fill="none" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" stroke-dasharray="240 600"><animateTransform id="chart_storage_tier_hot_warm_coldDonutSpin" attributeName="transform" type="rotate" from="0 400 235" to="360 400 235" dur="8s" repeatCount="indefinite"/></circle><text id="chart_storage_tier_hot_warm_coldDonutMetric" data-edit-id="donut-metric" data-edit-label="Center metric" x="400" y="244" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">38%</text></g>
