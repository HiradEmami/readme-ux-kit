<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_storage_tier_hot_warm_coldTitle chart_storage_tier_hot_warm_coldDesc">
  <title id="chart_storage_tier_hot_warm_coldTitle">Hot / Warm / Cold Storage</title>
  <desc id="chart_storage_tier_hot_warm_coldDesc">Animated README donut chart for Hot / Warm / Cold Storage. Illustrative sample values (38, 34, 18, 10) with a four-second focus loop.</desc>
