<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_traffic_protocol_distributionTitle chart_traffic_protocol_distributionDesc">
  <title id="chart_traffic_protocol_distributionTitle">Traffic Protocol Share</title>
  <desc id="chart_traffic_protocol_distributionDesc">Animated README donut chart for Traffic Protocol Share. Illustrative sample values (48, 26, 16, 10) with a four-second focus loop.</desc>
  <g id="chart_traffic_protocol_distributionBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#050f19"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="chart_traffic_protocol_distributionHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_traffic_protocol_distributionLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Traffic Protocol Share</text><text id="chart_traffic_protocol_distributionTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#67e8f9">ILLUSTRATIVE DATA · DONUT</text></g>
  <g id="chart_traffic_protocol_distributionPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><circle cx="400" cy="235" r="96" fill="none" stroke="#050f19" stroke-width="28"/><circle cx="400" cy="235" r="96" fill="none" stroke="#818cf8" stroke-width="26" stroke-dasharray="420 600"/><circle cx="400" cy="235" r="96" fill="none" stroke="#22d3ee" stroke-width="26" stroke-linecap="round" stroke-dasharray="240 600"><animateTransform id="chart_traffic_protocol_distributionDonutSpin" attributeName="transform" type="rotate" from="0 400 235" to="360 400 235" dur="8s" repeatCount="indefinite"/></circle><text id="chart_traffic_protocol_distributionDonutMetric" data-edit-id="donut-metric" data-edit-label="Center metric" x="400" y="244" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">48%</text></g>
  <g id="chart_traffic_protocol_distributionLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#22d3ee"/><text id="chart_traffic_protocol_distributionLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (48, 26, 16, 10) are illustrative</text></g>
</svg>
