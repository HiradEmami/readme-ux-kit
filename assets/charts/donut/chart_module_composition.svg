<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart_module_compositionTitle chart_module_compositionDesc">
  <title id="chart_module_compositionTitle">Module Composition</title>
  <desc id="chart_module_compositionDesc">A README donut section explaining module composition. Illustrative sample values are 54, 79, 72, 95, 81, 86 and do not represent live project metrics. A subtle four-second marker loop indicates the current focus; the complete state remains visible.</desc>
<g id="chart_module_compositionBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect width="800" height="450" rx="18" fill="#08111f"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111c2e" stroke="#22d3ee" stroke-width="2"/></g><text id="chart_module_compositionLabel" data-edit-id="label" data-edit-label="Chart title" x="55" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="750" fill="#f8fafc">Module Composition</text><text x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">ILLUSTRATIVE DATA</text><g id="chart_module_compositionPlot" data-edit-id="plot" data-edit-label="Illustrative chart marks"><circle cx="390" cy="245" r="105" fill="none" stroke="#60a5fa" stroke-width="46" opacity=".28"/><circle cx="390" cy="245" r="105" fill="none" stroke="#22d3ee" stroke-width="46" stroke-dasharray="356.4 660" transform="rotate(-90 390 245)"/><text x="390" y="240" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#f8fafc">SAMPLE MIX</text><text x="390" y="272" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#cbd5e1">A / remainder</text><circle cx="724" cy="96" r="8" fill="#22d3ee"><animate id="chart_module_compositionFocusMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle></g><g id="chart_module_compositionLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="398" width="14" height="14" rx="3" fill="#22d3ee"/><text x="78" y="410" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values are illustrative</text></g>
</svg>
