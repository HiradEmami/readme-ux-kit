<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_tenant_rate_limit_hotspotTitle chart_tenant_rate_limit_hotspotDesc">
  <title id="chart_tenant_rate_limit_hotspotTitle">Tenant Rate-Limit Hotspots</title>
  <desc id="chart_tenant_rate_limit_hotspotDesc">Animated README heatmap chart for Tenant Rate-Limit Hotspots. Illustrative sample values (60, 78, 85, 72, 91, 83) with a four-second focus loop.</desc>
  <g id="chart_tenant_rate_limit_hotspotBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#050f19"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0c1f31" stroke="#22d3ee" stroke-width="2"/></g>
  <g id="chart_tenant_rate_limit_hotspotHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_tenant_rate_limit_hotspotLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Tenant Rate-Limit Hotspots</text><text id="chart_tenant_rate_limit_hotspotTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#67e8f9">ILLUSTRATIVE DATA · HEATMAP</text></g>
  <g id="chart_tenant_rate_limit_hotspotPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><g fill="#22d3ee" opacity="0.72"><rect x="155" y="135" width="84" height="52" rx="8"/><rect x="255" y="135" width="84" height="52" rx="8"/><rect x="355" y="135" width="84" height="52" rx="8"/><rect x="455" y="135" width="84" height="52" rx="8"/><rect x="555" y="135" width="84" height="52" rx="8"/><rect x="155" y="203" width="84" height="52" rx="8"/><rect x="255" y="203" width="84" height="52" rx="8"/><rect x="355" y="203" width="84" height="52" rx="8"/><rect x="455" y="203" width="84" height="52" rx="8"/><rect x="555" y="203" width="84" height="52" rx="8"/><rect x="155" y="271" width="84" height="52" rx="8"/><rect x="255" y="271" width="84" height="52" rx="8"/><rect x="355" y="271" width="84" height="52" rx="8"/><rect x="455" y="271" width="84" height="52" rx="8"/><rect x="555" y="271" width="84" height="52" rx="8"/></g><rect x="255" y="135" width="84" height="52" rx="8" fill="none" stroke="#67e8f9" stroke-width="3.5"><animate id="chart_tenant_rate_limit_hotspotHeatScan" attributeName="x" values="155;255;355;455;155" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="chart_tenant_rate_limit_hotspotLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#22d3ee"/><text id="chart_tenant_rate_limit_hotspotLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (60, 78, 85, 72, 91, 83) are illustrative</text></g>
</svg>
