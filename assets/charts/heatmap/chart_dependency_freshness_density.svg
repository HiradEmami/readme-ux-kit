<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_dependency_freshness_densityTitle chart_dependency_freshness_densityDesc">
  <title id="chart_dependency_freshness_densityTitle">Dependency Freshness Matrix</title>
  <desc id="chart_dependency_freshness_densityDesc">Animated README heatmap chart for Dependency Freshness Matrix. Illustrative sample values (68, 90, 75, 82, 94, 79) with a four-second focus loop.</desc>
  <g id="chart_dependency_freshness_densityBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#06120b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#0e2417" stroke="#34d399" stroke-width="2"/></g>
  <g id="chart_dependency_freshness_densityHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_dependency_freshness_densityLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Dependency Freshness Matrix</text><text id="chart_dependency_freshness_densityTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">ILLUSTRATIVE DATA · HEATMAP</text></g>
  <g id="chart_dependency_freshness_densityPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><g fill="#34d399" opacity="0.72"><rect x="155" y="135" width="84" height="52" rx="8"/><rect x="255" y="135" width="84" height="52" rx="8"/><rect x="355" y="135" width="84" height="52" rx="8"/><rect x="455" y="135" width="84" height="52" rx="8"/><rect x="555" y="135" width="84" height="52" rx="8"/><rect x="155" y="203" width="84" height="52" rx="8"/><rect x="255" y="203" width="84" height="52" rx="8"/><rect x="355" y="203" width="84" height="52" rx="8"/><rect x="455" y="203" width="84" height="52" rx="8"/><rect x="555" y="203" width="84" height="52" rx="8"/><rect x="155" y="271" width="84" height="52" rx="8"/><rect x="255" y="271" width="84" height="52" rx="8"/><rect x="355" y="271" width="84" height="52" rx="8"/><rect x="455" y="271" width="84" height="52" rx="8"/><rect x="555" y="271" width="84" height="52" rx="8"/></g><rect x="255" y="135" width="84" height="52" rx="8" fill="none" stroke="#6ee7b7" stroke-width="3.5"><animate id="chart_dependency_freshness_densityHeatScan" attributeName="x" values="155;255;355;455;155" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="chart_dependency_freshness_densityLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#34d399"/><text id="chart_dependency_freshness_densityLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (68, 90, 75, 82, 94, 79) are illustrative</text></g>
</svg>
