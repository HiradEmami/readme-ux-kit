<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_chaos_fault_resilience_gridTitle chart_chaos_fault_resilience_gridDesc">
  <title id="chart_chaos_fault_resilience_gridTitle">Chaos Fault Resilience Grid</title>
  <desc id="chart_chaos_fault_resilience_gridDesc">Animated README heatmap chart for Chaos Fault Resilience Grid. Illustrative sample values (80, 76, 92, 84, 70, 89) with a four-second focus loop.</desc>
  <g id="chart_chaos_fault_resilience_gridBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#11070d"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#23101a" stroke="#fb7185" stroke-width="2"/></g>
  <g id="chart_chaos_fault_resilience_gridHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_chaos_fault_resilience_gridLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Chaos Fault Resilience Grid</text><text id="chart_chaos_fault_resilience_gridTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fda4af">ILLUSTRATIVE DATA · HEATMAP</text></g>
  <g id="chart_chaos_fault_resilience_gridPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><g fill="#fb7185" opacity="0.72"><rect x="155" y="135" width="84" height="52" rx="8"/><rect x="255" y="135" width="84" height="52" rx="8"/><rect x="355" y="135" width="84" height="52" rx="8"/><rect x="455" y="135" width="84" height="52" rx="8"/><rect x="555" y="135" width="84" height="52" rx="8"/><rect x="155" y="203" width="84" height="52" rx="8"/><rect x="255" y="203" width="84" height="52" rx="8"/><rect x="355" y="203" width="84" height="52" rx="8"/><rect x="455" y="203" width="84" height="52" rx="8"/><rect x="555" y="203" width="84" height="52" rx="8"/><rect x="155" y="271" width="84" height="52" rx="8"/><rect x="255" y="271" width="84" height="52" rx="8"/><rect x="355" y="271" width="84" height="52" rx="8"/><rect x="455" y="271" width="84" height="52" rx="8"/><rect x="555" y="271" width="84" height="52" rx="8"/></g><rect x="255" y="135" width="84" height="52" rx="8" fill="none" stroke="#fda4af" stroke-width="3.5"><animate id="chart_chaos_fault_resilience_gridHeatScan" attributeName="x" values="155;255;355;455;155" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="chart_chaos_fault_resilience_gridLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#fb7185"/><text id="chart_chaos_fault_resilience_gridLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (80, 76, 92, 84, 70, 89) are illustrative</text></g>
