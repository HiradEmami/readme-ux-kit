<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_simd_instruction_occupancyTitle chart_simd_instruction_occupancyDesc">
  <title id="chart_simd_instruction_occupancyTitle">SIMD Instruction Occupancy</title>
  <desc id="chart_simd_instruction_occupancyDesc">Animated README heatmap chart for SIMD Instruction Occupancy. Illustrative sample values (74, 88, 81, 93, 69, 87) with a four-second focus loop.</desc>
  <g id="chart_simd_instruction_occupancyBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#070c1b"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#111936" stroke="#60a5fa" stroke-width="2"/></g>
  <g id="chart_simd_instruction_occupancyHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_simd_instruction_occupancyLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">SIMD Instruction Occupancy</text><text id="chart_simd_instruction_occupancyTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">ILLUSTRATIVE DATA · HEATMAP</text></g>
  <g id="chart_simd_instruction_occupancyPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><g fill="#60a5fa" opacity="0.72"><rect x="155" y="135" width="84" height="52" rx="8"/><rect x="255" y="135" width="84" height="52" rx="8"/><rect x="355" y="135" width="84" height="52" rx="8"/><rect x="455" y="135" width="84" height="52" rx="8"/><rect x="555" y="135" width="84" height="52" rx="8"/><rect x="155" y="203" width="84" height="52" rx="8"/><rect x="255" y="203" width="84" height="52" rx="8"/><rect x="355" y="203" width="84" height="52" rx="8"/><rect x="455" y="203" width="84" height="52" rx="8"/><rect x="555" y="203" width="84" height="52" rx="8"/><rect x="155" y="271" width="84" height="52" rx="8"/><rect x="255" y="271" width="84" height="52" rx="8"/><rect x="355" y="271" width="84" height="52" rx="8"/><rect x="455" y="271" width="84" height="52" rx="8"/><rect x="555" y="271" width="84" height="52" rx="8"/></g><rect x="255" y="135" width="84" height="52" rx="8" fill="none" stroke="#93c5fd" stroke-width="3.5"><animate id="chart_simd_instruction_occupancyHeatScan" attributeName="x" values="155;255;355;455;155" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="chart_simd_instruction_occupancyLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#60a5fa"/><text id="chart_simd_instruction_occupancyLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (74, 88, 81, 93, 69, 87) are illustrative</text></g>
</svg>
