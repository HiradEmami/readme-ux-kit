<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="chart_regional_api_latency_matrixTitle chart_regional_api_latency_matrixDesc">
  <title id="chart_regional_api_latency_matrixTitle">Regional API Latency Matrix</title>
  <desc id="chart_regional_api_latency_matrixDesc">Animated README heatmap chart for Regional API Latency Matrix. Illustrative sample values (65, 82, 91, 74, 88, 95) with a four-second focus loop.</desc>
  <g id="chart_regional_api_latency_matrixBase" data-edit-id="base" data-edit-label="Chart background" data-edit-lock="true"><rect x="0" y="0" width="800" height="450" rx="18" fill="#0a091a"/><rect x="24" y="24" width="752" height="402" rx="14" fill="#151332" stroke="#a78bfa" stroke-width="2"/></g>
  <g id="chart_regional_api_latency_matrixHeader" data-edit-id="header" data-edit-label="Chart title and badge"><text id="chart_regional_api_latency_matrixLabel" data-edit-id="label" data-edit-label="Chart title" x="54" y="66" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="750" fill="#f8fafc">Regional API Latency Matrix</text><text id="chart_regional_api_latency_matrixTag" data-edit-id="tag" data-edit-label="Illustrative data tag" x="744" y="64" text-anchor="end" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">ILLUSTRATIVE DATA · HEATMAP</text></g>
  <g id="chart_regional_api_latency_matrixPlot" data-edit-id="plot" data-edit-label="Animated chart plot"><g fill="#a78bfa" opacity="0.72"><rect x="155" y="135" width="84" height="52" rx="8"/><rect x="255" y="135" width="84" height="52" rx="8"/><rect x="355" y="135" width="84" height="52" rx="8"/><rect x="455" y="135" width="84" height="52" rx="8"/><rect x="555" y="135" width="84" height="52" rx="8"/><rect x="155" y="203" width="84" height="52" rx="8"/><rect x="255" y="203" width="84" height="52" rx="8"/><rect x="355" y="203" width="84" height="52" rx="8"/><rect x="455" y="203" width="84" height="52" rx="8"/><rect x="555" y="203" width="84" height="52" rx="8"/><rect x="155" y="271" width="84" height="52" rx="8"/><rect x="255" y="271" width="84" height="52" rx="8"/><rect x="355" y="271" width="84" height="52" rx="8"/><rect x="455" y="271" width="84" height="52" rx="8"/><rect x="555" y="271" width="84" height="52" rx="8"/></g><rect x="255" y="135" width="84" height="52" rx="8" fill="none" stroke="#c4b5fd" stroke-width="3.5"><animate id="chart_regional_api_latency_matrixHeatScan" attributeName="x" values="155;255;355;455;155" dur="4s" repeatCount="indefinite"/></rect></g>
  <g id="chart_regional_api_latency_matrixLegend" data-edit-id="legend" data-edit-label="Chart legend"><rect x="54" y="394" width="14" height="14" rx="3" fill="#a78bfa"/><text id="chart_regional_api_latency_matrixLegendText" data-edit-id="legend-text" data-edit-label="Legend caption" x="78" y="406" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">SAMPLE SERIES · values (65, 82, 91, 74, 88, 95) are illustrative</text></g>
</svg>
