<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="collaboration_pairing_mapTitle collaboration_pairing_mapDesc">
  <title id="collaboration_pairing_mapTitle">Collaboration Pairing Map</title>
  <desc id="collaboration_pairing_mapDesc">A README collaboration section explaining collaboration pairing map. Collaboration Pairing Map as a adaptable profile story. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="collaboration_pairing_mapBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="900" height="420" rx="28" fill="#08111f"/><g id="collaboration_pairing_mapHeading" data-edit-id="heading" data-edit-label="Heading"><text x="54" y="60" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#22d3ee">EDITABLE PROFILE</text><text x="54" y="98" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="800" fill="#f8fafc">COLLABORATION PAIRING MAP</text></g><g id="collaboration_pairing_mapPortrait" data-edit-id="portrait" data-edit-label="Profile portrait placeholder"><circle cx="164" cy="214" r="86" fill="#111c2e" stroke="#22d3ee" stroke-width="4"/><circle cx="164" cy="184" r="30" fill="none" stroke="#f8fafc" stroke-width="7"/><path d="M104 280c18-46 102-46 120 0" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/></g><g id="collaboration_pairing_mapDetails" data-edit-id="details" data-edit-label="Profile details"><rect x="310" y="145" width="500" height="58" rx="12" fill="#111c2e" stroke="#263b5b"/><rect x="310" y="220" width="238" height="74" rx="12" fill="#111c2e" stroke="#263b5b"/><rect x="572" y="220" width="238" height="74" rx="12" fill="#111c2e" stroke="#263b5b"/><path d="M340 174H700M340 250H500M602 250H762" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/></g><circle id="collaboration_pairing_mapPulse" data-edit-id="motion" data-edit-label="Focus pulse" cx="846" cy="44" r="7" fill="#22d3ee"><animate id="collaboration_pairing_mapMotion" attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
</svg>
