  <title id="header_community_projectsTitle">Header Community Projects</title>
  <desc id="header_community_projectsDesc">A README animated section explaining header community projects. Header Community Projects as a document title system. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
