<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-labelledby="header_opentelemetry_sre_commandTitle header_opentelemetry_sre_commandDesc">
  <title id="header_opentelemetry_sre_commandTitle">OpenTelemetry SRE Command</title>
  <desc id="header_opentelemetry_sre_commandDesc">Animated README section header for OpenTelemetry SRE Command (TRACES · METRICS · ERROR BUDGETS).</desc>
  <g id="header_opentelemetry_sre_commandBase" data-edit-id="base" data-edit-label="Header background" data-edit-lock="true"><rect x="0" y="0" width="900" height="120" rx="18" fill="#06120b"/><rect x="12" y="12" width="876" height="96" rx="14" fill="#0e2417" stroke="#34d399" stroke-width="2"/></g>
  <g id="header_opentelemetry_sre_commandEmblem" data-edit-id="emblem" data-edit-label="Animated header emblem"><polygon points="68,28 96,44 96,76 68,92 40,76 40,44" fill="#06120b" stroke="#34d399" stroke-width="2.5"/><circle cx="68" cy="60" r="10" fill="#6ee7b7"><animate id="header_opentelemetry_sre_commandCorePulse" attributeName="r" values="7;13;7" dur="4s" repeatCount="indefinite"/></circle></g>
  <g id="header_opentelemetry_sre_commandCopy" data-edit-id="copy" data-edit-label="Header title and eyebrow"><text id="header_opentelemetry_sre_commandEyebrow" data-edit-id="eyebrow" data-edit-label="Header eyebrow" x="122" y="46" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="750" letter-spacing="1.4" fill="#6ee7b7">TRACES · METRICS · ERROR BUDGETS</text><text id="header_opentelemetry_sre_commandLabel" data-edit-id="label" data-edit-label="Header title" x="122" y="82" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="800" fill="#f8fafc">OpenTelemetry SRE Command</text></g>
  <g id="header_opentelemetry_sre_commandSignal" data-edit-id="signal" data-edit-label="Animated signal accent"><path d="M690 42H855M720 60H855M705 78H855" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="16 10"><animate id="header_opentelemetry_sre_commandTraceAnim" attributeName="stroke-dashoffset" values="52;0" dur="4s" repeatCount="indefinite"/></path><circle cx="690" cy="42" r="5" fill="#fbbf24"/></g>
</svg>
