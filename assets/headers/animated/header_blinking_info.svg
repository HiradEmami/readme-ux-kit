<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-labelledby="header_blinking_info-title header_blinking_info-desc">
  <title id="header_blinking_info-title">Header Blinking Info</title>
  <desc id="header_blinking_info-desc">An animated README SVG asset illustrating Header Blinking Info.</desc>
  <rect width="900" height="110" fill="#020617"/>
  <text x="450" y="65" text-anchor="middle" font-size="42" fill="#38bdf8">
    INFO!
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
