<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-labelledby="header_rotating_square-title header_rotating_square-desc">
  <title id="header_rotating_square-title">Header Rotating Square</title>
  <desc id="header_rotating_square-desc">An animated README SVG asset illustrating Header Rotating Square.</desc>
  <rect width="900" height="120" fill="#020617"/>
  <g transform="translate(450,60)">
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="450" y="65" text-anchor="middle" font-size="42" fill="#f8fafc">MODULES</text>
</svg>
