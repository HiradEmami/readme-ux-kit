<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-labelledby="header_release_engineeringTitle header_release_engineeringDesc">
  <title id="header_release_engineeringTitle">Header Release Engineering</title>
  <desc id="header_release_engineeringDesc">A README animated section explaining header release engineering. Header Release Engineering as a document title system. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
