<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-labelledby="header_local_toolsTitle header_local_toolsDesc">
  <title id="header_local_toolsTitle">Header Local Tools</title>
  <desc id="header_local_toolsDesc">A README animated section explaining header local tools. Header Local Tools as a document title system. All labels and groups are editable. A subtle four-second loop preserves a complete first frame.</desc>
  <rect id="header_local_toolsBackground" data-edit-id="background" data-edit-label="Background" data-edit-lock="true" width="900" height="120" rx="22" fill="#08111f"/><g id="header_local_toolsTitleLane" data-edit-id="title" data-edit-label="Header title"><rect x="24" y="18" width="852" height="74" rx="16" fill="#111c2e" stroke="#263b5b"/><circle cx="58" cy="55" r="14" fill="none" stroke="#60a5fa" stroke-width="3"/><path d="M58 47v16M50 55h16" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><text x="88" y="63" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="800" letter-spacing="1" fill="#f8fafc">LOCAL TOOLS</text><text x="820" y="60" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">SECTION</text></g><path id="header_local_toolsTrace" data-edit-id="motion" data-edit-label="Signal trace" d="M30 102H870" stroke="#60a5fa" stroke-width="3" stroke-dasharray="18 14"><animate id="header_local_toolsMotion" attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite"/></path>
</svg>
