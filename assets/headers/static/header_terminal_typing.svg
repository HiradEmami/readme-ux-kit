<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="img" aria-labelledby="header_terminal_typing-title header_terminal_typing-desc">
  <title id="header_terminal_typing-title">Header Terminal Typing</title>
  <desc id="header_terminal_typing-desc">An animated README SVG asset illustrating Header Terminal Typing.</desc>
  <style>
    .t { font: 700 54px 'Courier New', monospace; fill: #22c55e; }
    .c { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="900" height="100" rx="14" fill="#020617"/>
  <text x="30" y="64" class="t">&gt; CONTRIBUTING<tspan class="c">_</tspan></text>
</svg>
